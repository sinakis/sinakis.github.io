/* ---------- passive tree ---------- */
const tv={x:0,y:0,z:.9,cv:null,ctx:null,drag:null,moved:0,cw:300,ch:340};
function treeAllocSet(){return new Set(SAVE.pass);}
function treePoints(){return SAVE.lvl+PASS_BONUS-(SAVE.pass.length-1);}
function treeCanAlloc(id){
  if(id===0)return false;const al=treeAllocSet();
  if(al.has(id)||treePoints()<1)return false;
  return TREE[id].adj.some(a=>al.has(a));
}
function treeCanRefund(id){
  if(id===0)return false;const al=treeAllocSet();if(!al.has(id))return false;
  al.delete(id);
  const seenN=new Set([0]),q=[0];
  while(q.length){const c=q.pop();for(const a of TREE[c].adj)if(al.has(a)&&!seenN.has(a)){seenN.add(a);q.push(a);}}
  return seenN.size===al.size;
}
function pageTree(){
  return `<div class="dim" style="margin-bottom:8px">Points left: <b style="color:#ffd23a" id="tPts">${treePoints()}</b>. Drag to pan. Tap a node to inspect it.</div><canvas id="tree"></canvas><div class="btnrow" style="margin:8px 0"><button class="btn2" data-a="zoom" data-d="1">ZOOM +</button><button class="btn2" data-a="zoom" data-d="-1">ZOOM -</button><button class="btn2" data-a="zoom" data-d="0">CENTER</button></div><div id="treeInfo"></div>`;
}
function treeInfoHtml(){
  const id=ui.tsel;
  if(id==null)return `<div class="irow empty">No node selected.</div>`;
  const n=TREE[id];
  let h=`<div class="card"><h3 style="color:${n.t==='key'?'#ff9a3a':(n.t==='notable'?'#ffd23a':'#d6cce8')}">${n.n}</h3><div class="base">${n.t==='key'?'Keystone':(n.t==='notable'?'Notable':(n.t==='start'?'Starting point':'Passive'))}</div>`;
  for(const e of n.m)h+=`<div class="mod">${fmtMod(e[0],e[1])}</div>`;
  h+='</div><div class="btnrow">';
  if(SAVE.pass.includes(id)){
    if(id!==0)h+=`<button class="btn2" data-a="refund" data-id="${id}" ${(treeCanRefund(id)&&(SAVE.cur.regret||0)>0)?'':'disabled'}>REFUND (REGRET x${SAVE.cur.regret||0})</button>`;
  }else h+=`<button class="btn2 pri" data-a="alloc" data-id="${id}" ${treeCanAlloc(id)?'':'disabled'}>ALLOCATE</button>`;
  h+='</div>';
  return h;
}
function treeInit(){
  const c=$('tree');if(!c)return;
  tv.cv=c;tv.cw=Math.max(240,pBody.clientWidth-28||300);tv.ch=Math.min(380,Math.max(260,Math.round(window.innerHeight*.4)));
  c.width=tv.cw;c.height=tv.ch;c.style.height=tv.ch+'px';
  tv.ctx=c.getContext('2d');
  c.addEventListener('pointerdown',e=>{tv.drag={x:e.clientX,y:e.clientY};tv.moved=0;try{c.setPointerCapture(e.pointerId);}catch(_){}});
  c.addEventListener('pointermove',e=>{
    if(!tv.drag)return;
    const dx=e.clientX-tv.drag.x,dy=e.clientY-tv.drag.y;
    tv.moved+=Math.abs(dx)+Math.abs(dy);
    tv.x+=dx;tv.y+=dy;tv.drag={x:e.clientX,y:e.clientY};treeDraw();
  });
  c.addEventListener('pointerup',e=>{
    if(tv.drag&&tv.moved<8){
      const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*(c.width/r.width),py=(e.clientY-r.top)*(c.height/r.height);
      let best=null,bd=26;
      for(const n of TREE){const p=nodeScr(n),d=Math.hypot(p.x-px,p.y-py);if(d<bd){bd=d;best=n;}}
      if(best){ui.tsel=best.id;$('treeInfo').innerHTML=treeInfoHtml();treeDraw();}
    }
    tv.drag=null;
  });
  c.addEventListener('pointercancel',()=>{tv.drag=null;});
  treeDraw();
  $('treeInfo').innerHTML=treeInfoHtml();
}
function nodeScr(n){return{x:n.x*tv.z+tv.x+tv.cw/2,y:n.y*tv.z+tv.y+tv.ch/2};}
function treeDraw(){
  const c=tv.ctx;if(!c||!tv.cv)return;
  c.fillStyle='#0f0c14';c.fillRect(0,0,tv.cw,tv.ch);
  const al=treeAllocSet();
  for(const n of TREE)for(const a of n.adj){
    if(a<n.id)continue;
    const p=nodeScr(n),q=nodeScr(TREE[a]);
    c.strokeStyle=(al.has(n.id)&&al.has(a))?'#ffd23a':'#3a2f4a';c.lineWidth=al.has(n.id)&&al.has(a)?3:2;
    c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();
  }
  for(const n of TREE){
    const p=nodeScr(n),s=(n.t==='key'?13:(n.t==='notable'?9:(n.t==='start'?11:6)))*Math.max(.8,tv.z);
    const have=al.has(n.id),can=treeCanAlloc(n.id);
    c.fillStyle='#000';c.fillRect(p.x-s-2,p.y-s-2,s*2+4,s*2+4);
    c.fillStyle=have?'#ffd23a':(can?'#6fd6ff':'#4a3f5c');
    if(n.t==='key'&&!have)c.fillStyle=can?'#6fd6ff':'#6a4a3a';
    c.fillRect(p.x-s,p.y-s,s*2,s*2);
    if(ui.tsel===n.id){c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(p.x-s-4,p.y-s-4,s*2+8,s*2+8);}
  }
}

function handleAct(a,d){
  if(a!=='trash'&&a!=='leave'&&a!=='reset')ui.confirm=null;
  switch(a){
    case 'tab':ui.page=d.p;ui.sheet=null;ui.msg='';if(ui.menu)ui.lastTab=d.p;renderPanel(false);break;
    case 'close':closePanel();break;
    case 'open':ui.sheet={id:+d.id,view:'item'};renderSheet();break;
    case 'sheetclose':ui.sheet=null;renderSheet();break;
    case 'sheetback':ui.sheet={id:ui.sheet.id,view:'item'};renderSheet();break;
    case 'slotpick':ui.sheet={view:'slotpick',slot:d.slot};renderSheet();break;
    case 'picker':ui.sheet={view:'picker'};renderSheet();break;
    case 'pick':ui.craft=+d.id;ui.sheet=null;ui.msg='';renderPanel(true);break;
    case 'equip':case 'equipnow':{
      const f=findItem(+d.id),name=f?itemTitle(f.it):'';
      const m=equipItem(+d.id,a==='equipnow'?d.slot:undefined);
      ui.sheet=null;ui.msg=m||('Equipped '+name+'.');if(!m)sfx.pick();
      renderPanel(true);break;}
    case 'unequip':{const m=unequip(d.slot);ui.sheet=null;ui.msg=m||'Unequipped.';renderPanel(true);break;}
    case 'tostash':{
      const f=findItem(+d.id);
      if(f&&f.w==='inv'){if(SAVE.stash.length>=STASH_CAP)ui.msg='Stash is full.';else{removeFrom('inv',f.it);SAVE.stash.push(f.it);ui.msg='';markSave();}}
      ui.sheet=null;renderPanel(true);break;}
    case 'fromstash':{
      const f=findItem(+d.id);
      if(f&&f.w==='stash'){if(SAVE.inv.length>=INV_CAP)ui.msg='Your bag is full.';else{removeFrom('stash',f.it);SAVE.inv.push(f.it);ui.msg='';markSave();}}
      ui.sheet=null;renderPanel(true);break;}
    case 'sell':{
      const f=findItem(+d.id);
      if(f&&f.w==='inv'){const rw=doSell(f.it);ui.msg='Sold for '+rewardText(rw)+'.';sfx.pick();}
      ui.sheet=null;renderPanel(true);break;}
    case 'sellall':{
      const list=SAVE.inv.filter(x=>x.kind==='gear'&&x.rarity===d.r&&!hasGem(x));
      const tot={};
      for(const it of list)for(const r of doSell(it))tot[r[0]]=(tot[r[0]]||0)+r[1];
      ui.msg=list.length?`Sold ${list.length} items for ${rewardText(Object.entries(tot))}.`:'Nothing to sell.';
      sfx.pick();renderPanel(true);break;}
    case 'trash':{
      const f=findItem(+d.id);
      if(ui.confirm==='trash'+d.id){
        if(f&&(f.w==='inv'||f.w==='stash')){removeFrom(f.w,f.it);markSave();}
        ui.confirm=null;ui.sheet=null;renderPanel(true);
      }else{ui.confirm='trash'+d.id;if(ui.sheet)ui.sheet.keep=true;renderSheet();}
      break;}
    case 'bench':ui.craft=+d.id;ui.msg='';ui.page='bench';ui.sheet=null;renderPanel(false);break;
    case 'orb':{
      const f=ui.craft?findItem(ui.craft):null;
      if(!f){ui.msg='Choose an item first.';ui.sheet=null;renderPanel(true);break;}
      if((SAVE.cur[d.id]||0)<1){ui.msg='You have none of that orb.';renderPanel(true);break;}
      const r=applyOrb(f.it,d.id);
      if(r.ok){SAVE.cur[d.id]--;sfx.craft();if(f.w==='eq'||f.w==='sock')recomputeAll();markSave();}else sfx.nope();
      ui.msg=r.msg;renderPanel(true);break;}
    case 'sockpick':ui.sheet={id:+d.host,view:'socket',idx:+d.idx};renderSheet();break;
    case 'sockput':{
      const s=ui.sheet,m=socketGem(s.id,s.idx,+d.gem);
      if(m){s.msg=m;s.keep=true;renderSheet();}
      else{ui.sheet={id:s.id,view:'item'};renderPanel(true);}
      break;}
    case 'unsock':{
      const m=unsocketGem(+d.host,+d.idx);
      ui.sheet={id:+d.host,view:'item'};if(m)ui.msg=m;renderPanel(true);break;}
    case 'swapsk':SAVE.opt.swap=SAVE.opt.swap?0:1;markSave();renderPanel(true);break;
    case 'sort':sortBag();renderPanel(true);break;
    case 'view':ui.list=ui.list?0:1;renderPanel(true);break;
    case 'quick':ui.quick=ui.quick?0:1;renderPanel(true);break;
    case 'usemap':ui.towerMap=+d.id;ui.page='tower';ui.sheet=null;ui.msg='';renderPanel(false);break;
    case 'clearmap':ui.towerMap=null;renderPanel(true);break;
    case 'floor+':ui.towerFloor=Math.min(SAVE.best+1,(ui.towerFloor||1)+1);renderPanel(true);break;
    case 'floor-':ui.towerFloor=Math.max(1,(ui.towerFloor||1)-1);renderPanel(true);break;
    case 'enter':{
      const mp=ui.towerMap?findItem(ui.towerMap):null;
      let m=null,f=ui.towerFloor;
      if(mp&&mp.it.kind==='map'){m=mp.it;f=m.floor;if(f>SAVE.best+1)break;removeFrom(mp.w,m);}
      ui.towerMap=null;
      closePanel();enterFloor(f,m);break;}
    case 'app':SAVE.app[d.k]=d.v;buildSprites();markSave();renderPanel(true);break;
    case 'opt':SAVE.opt[d.k]=SAVE.opt[d.k]?0:1;markSave();renderPanel(true);break;
    case 'export':{
      const s=exportSave(),box=$('saveBox');
      if(box){box.value=s;box.select();}
      try{if(navigator.clipboard)navigator.clipboard.writeText(s).catch(()=>{});}catch(_){}
      break;}
    case 'import':{
      const box=$('saveBox'),ok=box&&importSave(box.value||'');
      if(ok){buildSprites();closePanel();enterHideout();banner('SAVE IMPORTED',1800);}
      else{ui.msg='That code could not be read.';renderPanel(true);}
      break;}
    case 'reset':
      if(ui.confirm==='reset'){
        try{localStorage.removeItem(KEY);}catch(_){}
        UID=1;newSave();buildSprites();recomputeAll();closePanel();enterHideout();banner('NEW GAME',1800);
      }else{ui.confirm='reset';renderPanel(true);}
      break;
    case 'leave':
      if(ui.confirm==='leave'){closePanel();enterHideout();}
      else{ui.confirm='leave';renderPanel(true);}
      break;
    case 'zoom':
      if(d.d==='0'){tv.x=0;tv.y=0;tv.z=.9;}else tv.z=clamp(tv.z+(+d.d)*.2,.4,2);
      treeDraw();break;
    case 'alloc':{
      const id=+d.id;
      if(treeCanAlloc(id)){SAVE.pass.push(id);recomputeAll();markSave();sfx.craft();}
      $('treeInfo').innerHTML=treeInfoHtml();$('tPts').textContent=treePoints();treeDraw();break;}
    case 'refund':{
      const id=+d.id;
      if(treeCanRefund(id)&&(SAVE.cur.regret||0)>0){SAVE.cur.regret--;SAVE.pass.splice(SAVE.pass.indexOf(id),1);recomputeAll();markSave();sfx.craft();}
      $('treeInfo').innerHTML=treeInfoHtml();$('tPts').textContent=treePoints();treeDraw();break;}
  }
}

const pad=$('pad'),zone=$('stickZone'),baseEl=$('base'),knob=$('knob');
let stickId=null,sx0=0,sy0=0;
function placeBase(){const r=pad.getBoundingClientRect();baseEl.style.left=(sx0-r.left)+'px';baseEl.style.top=(sy0-r.top)+'px';}
zone.addEventListener('pointerdown',e=>{
  ensureAudio();
  stickId=e.pointerId;
  try{zone.setPointerCapture(e.pointerId);}catch(_){}
  sx0=e.clientX;sy0=e.clientY;placeBase();
  baseEl.hidden=false;knob.style.transform='translate(0px,0px)';
  input.sx=0;input.sy=0;
  $('hint').classList.add('gone');
  e.preventDefault();
});
zone.addEventListener('pointermove',e=>{
  if(e.pointerId!==stickId)return;
  const R=52;let dx=e.clientX-sx0,dy=e.clientY-sy0;const m=Math.hypot(dx,dy);
  if(m>R){const k=(m-R)/m;sx0+=dx*k;sy0+=dy*k;placeBase();dx=e.clientX-sx0;dy=e.clientY-sy0;}
  input.sx=dx/R;input.sy=dy/R;
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
});
function endStick(e){if(e.pointerId!==stickId)return;stickId=null;input.sx=0;input.sy=0;baseEl.hidden=true;}
zone.addEventListener('pointerup',endStick);
zone.addEventListener('pointercancel',endStick);

function bindBtn(el,down,up,move){
  el.addEventListener('pointerdown',e=>{
    ensureAudio();
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    el.classList.add('down');down(e);e.preventDefault();
  });
  const u=e=>{if(!el.classList.contains('down'))return;el.classList.remove('down');up(e);};
  el.addEventListener('pointerup',u);
  el.addEventListener('pointercancel',u);
  if(move)el.addEventListener('pointermove',move);
}

/* ---------- sizing ---------- */
function fit(){
  const app=$('app'),aw=app.clientWidth||window.innerWidth,ah=app.clientHeight||window.innerHeight;
  const sc=Math.max(2,Math.floor(aw/150));
  const gh=Math.max(300,Math.round(ah*.6));
  const nw=Math.max(120,Math.floor(aw/sc)),nh=Math.max(140,Math.floor(gh/sc));
  dispScale=sc;
  if(nw!==W||nh!==H){W=nw;H=nh;cv.width=W;cv.height=H;g.imageSmoothingEnabled=false;}
  cv.style.width=(W*sc)+'px';cv.style.height=(H*sc)+'px';
  $('view').style.width=(W*sc)+'px';
}
window.addEventListener('resize',fit);
fit();

  setText('tFoes',hide?'':enemies.length+(enemies.length===1?' FOE':' FOES'));
  setText('bossName',(bossRef&&bossRef.state!=='idle')?'THE WARDEN':'');
  {const n=bagCount();setText('bagCnt','BAG '+n+'/40');const f=n>=40;if(cache.bagfull!==f){cache.bagfull=f;$('bMenu').classList.toggle('full',f);}}
  setHidden('bSkA',hide);setHidden('bSkB',hide);setHidden('bFlask',hide);
  if(hide){
    setText('lAtk','USE');setText('sAtk',nearProp?nearProp.hint:'GET CLOSER');
    if(cache.useCls!==1){cache.useCls=1;$('bAtk').classList.add('use');}
  }else{
    setText('lAtk','SHOOT');setText('sAtk','HOLD');
    if(cache.useCls!==0){cache.useCls=0;$('bAtk').classList.remove('use');}
    for(let b=0;b<2;b++){
      const sk=SK[skIdx(b)],id=b?'bSkB':'bSkA';
      setText(b?'sSkB':'sSkA',sk?short(sk.name,11)+' '+sk.mana:'NO GEM');
      if(sk)setCd(id,P.skCd[skIdx(b)]>0?P.skCd[skIdx(b)]/Math.max(.1,P.skMax[skIdx(b)]):(P.mana<sk.mana?.5:0));else setCd(id,.7);
    }
    setText('sFlask',String(P.flaskCh));
    setCd('bFlask',P.flaskCh<=0?.6:0);
  }
  setText('sRoll',String(Math.floor(P.dodge)));
  setCd('bRoll',P.dodge>=1?0:1-P.dodge);
  setHtml('log',logLines.map(l=>`<div style="color:${l.col}">${l.txt}</div>`).join(''));
}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>.1)dt=.1;
  if(saveT>0){saveT-=dt;if(saveT<=0)persist();}
  if(uiOpen)return;
  acc+=dt;
  while(acc>=STEP){
    if(hitstop>0)hitstop-=STEP;else step(STEP);
    acc-=STEP;
  }
  render();
  updateDom();
}

/* ---------- boot ---------- */
SAVE=loadSave();
let fresh=false;
if(!SAVE){newSave();fresh=true;}
SAVE.opt=Object.assign({shake:0,flash:0,nums:1,hideNormal:1,sfx:1,swap:0},SAVE.opt||{});
SAVE.app=Object.assign({skin:SKIN[0],hair:HAIR[0],cloth:CLOTH[0]},SAVE.app||{});
SAVE.cur=SAVE.cur||{};SAVE.pass=SAVE.pass&&SAVE.pass.length?SAVE.pass:[0];
buildSprites();
recomputeAll();
enterHideout();
if(fresh)persist();
setTimeout(()=>banner(fresh?'WALK TO THE TOWER DOOR AND PRESS USE':'WELCOME BACK',3500),400);
window.__spire={exitTile:()=>exitTile,solid:solidAt,bossRef:()=>bossRef,P,input,SAVE:()=>SAVE,ST:()=>ST,SK:()=>SK,enemies:()=>enemies,hazards:()=>hazards,drops:()=>drops,state:()=>state,floor:()=>floorN,mode:()=>mode,
  enterFloor,enterHideout,step,handleAct,openPanel,renderPanel,PAGES,ui,applyOrb,newGear,newGem,newMap,newUnique,equipItem,socketGem,computeStats,computeSkills,recomputeAll,
  treeCanAlloc,closePanel,findItem,dropLoot,exportSave,importSave,loadSave,persist,render,updateDom,TREE,killEnemy,addXp,nextFloor,genFloor,buildHideout,attackProfile};
requestAnimationFrame(frame);

})();
</script>
