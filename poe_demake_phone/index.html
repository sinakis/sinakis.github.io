<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spire Tower ARPG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Portrait phone layout: pixel game view on top (integer-scaled), thumb controls beneath,
   full-screen menu with a bottom tab bar and bottom sheets. One committed pixel-game look. */
:root{
  --ui0:#15111b; --ui1:#211a2b; --ui2:#352b46; --ui3:#6b5c86; --ui4:#d6cce8;
  --gold:#ffd23a; --danger:#ff5a2e; --good:#6fe08f; --bad:#ff7a6a;
  --font-pixel:'Silkscreen',ui-monospace,Menlo,Consolas,monospace;
  --font-text:'Pixelify Sans','Silkscreen',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ui0);color:var(--ui4);font-family:var(--font-pixel);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
#view{position:relative;flex:0 0 auto;align-self:center;background:#000;overflow:hidden}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hudtxt{position:absolute;right:8px;top:106px;text-align:right;font-size:11px;line-height:1.5;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none;letter-spacing:.06em}
#bMenu{position:absolute;left:50%;top:6px;transform:translateX(-50%);min-width:96px;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px var(--font-pixel);letter-spacing:.1em;color:#fff;background:var(--ui2);border:2px solid var(--ui3);box-shadow:0 3px 0 #0008;padding:0 10px;cursor:pointer}
#bMenu small{font-size:9px;color:var(--ui4);letter-spacing:.06em}
#bMenu.full{border-color:var(--bad)}#bMenu.full small{color:var(--bad)}
#bossName{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:10px;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;letter-spacing:.08em}
#log{position:absolute;left:8px;bottom:8px;font:12px/1.45 var(--font-text);pointer-events:none;text-shadow:0 2px 0 #000;max-width:68%}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;font-weight:700;font-size:15px;color:#fff;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 16px;line-height:1.3}
#banner.on{opacity:1}
#over{position:absolute;inset:0;background:#120d1cd9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
#over[hidden]{display:none}
#over .t{font-weight:700;font-size:26px;color:var(--danger);letter-spacing:.08em}
#over .sub{font-size:11px;color:var(--ui4);padding:0 20px;line-height:1.6}
.bigbtn{font:700 16px var(--font-pixel);letter-spacing:.1em;color:#1a1420;background:var(--gold);border:4px solid #fff3b8;padding:12px 20px;box-shadow:0 4px 0 #8a6a10;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
#pad{position:relative;flex:1 1 auto;min-height:0;background:var(--ui0);border-top:3px solid var(--ui2)}
#stickZone{position:absolute;left:0;top:0;bottom:0;width:46%}
#hint{position:absolute;left:16px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border:4px dashed var(--ui2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ui3);font-size:12px;letter-spacing:.1em;pointer-events:none;transition:opacity .3s}
#hint.gone{opacity:0}
#base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border:4px solid var(--ui3);border-radius:50%;pointer-events:none;background:#6b5c8633}
#base[hidden]{display:none}
#knob{position:absolute;left:28px;top:28px;width:48px;height:48px;border-radius:50%;background:#d6cce8;border:4px solid #15111b;box-shadow:0 0 0 4px var(--ui3)}
#cluster{position:absolute;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:270px;height:214px;transform-origin:100% 100%}
@media (max-height:720px),(max-width:400px){#cluster{transform:scale(.8)}}
.btn{--bc:#3a6ea5;position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:4px solid #fff9;background:var(--bc);color:#fff;font:700 11px var(--font-pixel);letter-spacing:.06em;box-shadow:0 5px 0 #0008;padding:0;border-radius:50%;overflow:hidden;touch-action:none;cursor:pointer}
.btn::before{content:'';position:absolute;inset:0;background:#000;opacity:.6;transform-origin:bottom;transform:scaleY(var(--cd,0));pointer-events:none}
.btn span{position:relative;pointer-events:none;text-shadow:0 2px 0 #0007}
.btn small{position:relative;font-size:9px;color:#fffc;letter-spacing:.04em;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.down{filter:brightness(1.3);transform:translateY(3px);box-shadow:0 2px 0 #0008}
.btn[hidden]{display:none}
#bAtk{--bc:#b8432f;right:0;bottom:6px;width:100px;height:100px;font-size:13px}
#bSkA{--bc:#2f6fb5;right:6px;bottom:116px;width:80px;height:80px}
#bSkB{--bc:#7a4ab5;right:96px;bottom:126px;width:72px;height:72px}
#bRoll{--bc:#2f8f5a;right:112px;bottom:26px;width:80px;height:80px}
#bFlask{--bc:#a8363f;right:204px;bottom:40px;width:60px;height:60px;font-size:9px}
#bAtk.use{--bc:#c9a21f}

/* ---------- menu panel ---------- */
#panel{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);z-index:30;background:var(--ui0);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
#panel[hidden]{display:none}
#pHead{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-bottom:3px solid var(--ui2);background:var(--ui1)}
#pTitle{flex:1;font:700 14px var(--font-pixel);letter-spacing:.1em;color:var(--gold)}
#pBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:12px 14px 24px;font:15px/1.45 var(--font-text);color:var(--ui4);-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
#pNav{display:flex;border-top:3px solid var(--ui2);background:var(--ui1);padding-bottom:env(safe-area-inset-bottom,0px)}
#pNav button{flex:1;min-height:58px;font:700 11px var(--font-pixel);letter-spacing:.08em;color:var(--ui3);background:none;border:0;border-top:4px solid transparent;margin-top:-3px;cursor:pointer}
#pNav button.on{color:var(--gold);border-top-color:var(--gold);background:var(--ui2)}
#pNav button.done{color:#1a1420;background:var(--gold);border-top-color:#fff3b8}
.btn2{flex:0 0 auto;min-height:44px;font:700 11px var(--font-pixel);letter-spacing:.08em;color:var(--ui4);background:var(--ui2);border:2px solid var(--ui3);padding:0 14px;cursor:pointer;box-shadow:0 3px 0 #0006}
.btn2:active{transform:translateY(2px);box-shadow:none}
.btn2.pri{background:var(--gold);color:#1a1420;border-color:#fff3b8}
.btn2.bad{background:#7a2a2a;border-color:#c25a5a;color:#fff}
.btn2.sm{min-height:34px;padding:0 10px;font-size:10px}
.btn2[disabled]{opacity:.4;cursor:default}
.btn2.on{background:var(--gold);color:#1a1420;border-color:#fff3b8}
.sec{font:700 11px var(--font-pixel);letter-spacing:.12em;color:var(--ui3);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}
.sec:first-child{margin-top:2px}
.sec b{color:var(--ui4);font-weight:700}
.sec b.full{color:var(--bad)}
.irow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:inherit;background:var(--ui1);border:2px solid var(--ui2);border-left:5px solid var(--rc,var(--ui2));padding:10px 10px;margin:0 0 6px;cursor:pointer;min-height:48px}
.irow:active{background:var(--ui2)}
.irow .ico{width:28px;height:28px;image-rendering:pixelated;flex:0 0 auto}
.irow .iname{font-weight:600;min-width:0;overflow-wrap:anywhere;flex:1 1 120px}
.irow .isub{font-size:12px;color:var(--ui3);margin-left:auto}
.irow.empty{color:var(--ui3);border-style:dashed;cursor:default}
.slotlbl{font:700 9px var(--font-pixel);color:var(--ui3);letter-spacing:.08em}
/* socket dots */
.sk{display:inline-block;width:15px;height:15px;border:2px solid #000;border-radius:50%;box-sizing:border-box;vertical-align:middle;position:relative}
.sk.R{background:#d8453f}.sk.G{background:#3fb860}.sk.B{background:#4a7bff}.sk.W{background:#eee}
.sk.has::after{content:'';position:absolute;inset:2px;background:#fff;border-radius:2px}
.sk.big{width:38px;height:38px;border-width:3px;cursor:pointer}
.sk.big.has::after{inset:7px}
.sk.sm{width:9px;height:9px;border-width:1px}.sk.sm.has::after{inset:1px}
.lk{display:inline-block;width:8px;height:5px;background:#e8dcc0;vertical-align:middle;margin:0 -1px}
.lk.off{background:transparent}
.lk.big{width:14px;height:7px}
.sockrow{display:inline-flex;align-items:center}
/* tiles (grid cells) */
.grid{display:grid;gap:6px}
.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr);gap:8px}.g2{grid-template-columns:repeat(2,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--ui1);border:2px solid var(--rc,var(--ui2));box-shadow:inset 0 0 0 1px #0006;padding:2px;min-width:0;cursor:pointer;font:inherit;color:inherit}
.tile:active{background:var(--ui2)}
.tile .ico{width:34px;height:34px;image-rendering:pixelated}
.tile .dots{display:flex;gap:2px;min-height:9px;align-items:center}
.tile .bd{position:absolute;right:3px;top:2px;font:700 8px var(--font-pixel);color:var(--ui3)}
.tile .lb{position:absolute;left:4px;top:3px;font:700 8px var(--font-pixel);color:var(--ui3);letter-spacing:.06em}
.tile.empty{border-style:dashed;border-color:var(--ui2);cursor:default}
.tile.empty .ico{opacity:.25}
.tile.sel{box-shadow:0 0 0 3px var(--gold)}
.doll .tile{aspect-ratio:1/1;min-height:92px}
.doll .tile .ico{width:44px;height:44px}
.doll .tile .nm{font-size:11px;line-height:1.15;text-align:center;max-width:94%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* cards, text */
.card{background:var(--ui1);border:3px solid var(--ui2);padding:12px;margin:0 0 12px}
.card h3{margin:0 0 2px;font:700 16px/1.3 var(--font-text)}
.card .base{font-size:12px;color:var(--ui3);margin-bottom:8px}
.prop{color:#fff}.imp{color:#9aa8ff}.mod{color:#8aa0ff}
.mod small,.imp small{color:var(--ui3);font-size:11px}
.uniq{color:#af6025}.dim{color:var(--ui3)}.bad{color:var(--bad)}.good{color:var(--good)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btnrow .btn2{flex:1 1 120px}
.cur{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:var(--ui1);border:2px solid var(--ui2);padding:8px 10px;cursor:pointer;min-width:0;min-height:52px}
.cur .ico{width:26px;height:26px;image-rendering:pixelated;flex:0 0 auto}
.cur .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.cur b{font-size:13px;font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.cur span{font-size:11px;color:var(--ui3);line-height:1.25}
.cur .n{margin-left:auto;font:700 13px var(--font-pixel);color:#fff}
.cur[disabled]{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--ui1);border:2px solid var(--ui2);padding:4px 8px;font-size:12px}
.chip .ico{width:18px;height:18px;image-rendering:pixelated}
.chip b{font:700 11px var(--font-pixel);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:8px}
.stats b{color:#fff;font-weight:600}
.msg{padding:9px 10px;background:#2a2238;border-left:4px solid var(--gold);margin:0 0 10px;font-size:13px;position:sticky;top:0;z-index:2}
.sw{display:inline-block;width:46px;height:46px;border:3px solid #000;margin:0 8px 8px 0;cursor:pointer;vertical-align:middle}
.sw.on{border-color:#fff}
canvas#tree{display:block;width:100%;background:#0f0c14;border:3px solid var(--ui2);touch-action:none;image-rendering:pixelated}
textarea#saveBox{width:100%;box-sizing:border-box;height:90px;background:var(--ui1);color:var(--ui4);border:2px solid var(--ui2);font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ui2);min-height:48px}
.cmp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.cmp span{padding:4px 7px;border:2px solid;font:700 10px var(--font-pixel);letter-spacing:.04em}
.cmp .up{color:var(--good);border-color:#2f6b43;background:#15291d}
.cmp .dn{color:var(--bad);border-color:#7a3a33;background:#2a1715}
.xpbar{height:8px;background:var(--ui2);margin:6px 0 10px;border:2px solid #000}
.xpbar i{display:block;height:100%;background:var(--gold)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn2{min-width:52px;font-size:16px}
.stepper .big{flex:1;text-align:center;font:700 20px var(--font-pixel);color:#fff;letter-spacing:.06em}
.seg{display:flex;border:2px solid var(--ui3)}
.seg button{flex:1;min-height:40px;font:700 10px var(--font-pixel);letter-spacing:.08em;color:var(--ui3);background:var(--ui1);border:0;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1420}
/* bottom sheet */
#sheetBg{position:absolute;inset:0;background:#000b;z-index:5}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;z-index:6;background:var(--ui1);border-top:4px solid var(--ui3);display:flex;flex-direction:column;box-shadow:0 -8px 24px #000a}
#sheet:not([hidden]){animation:sheetup .16s ease-out}
#sheet[hidden],#sheetBg[hidden]{display:none}
@keyframes sheetup{from{transform:translateY(32px);opacity:.4}}
#sheetTop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0 16px}
#sheetTop i{width:44px;height:5px;background:var(--ui3);display:block}
#sheetBody{overflow-y:auto;padding:8px 14px calc(18px + env(safe-area-inset-bottom,0px));touch-action:pan-y;font:15px/1.45 var(--font-text);-webkit-overflow-scrolling:touch}
.shHead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.shHead .ico{width:48px;height:48px;image-rendering:pixelated;flex:0 0 auto}
.shHead h3{margin:0;font:700 17px/1.25 var(--font-text)}
.shHead .base{font-size:12px;color:var(--ui3)}
@media (prefers-reduced-motion:reduce){#banner{transition:none}#sheet:not([hidden]){animation:none}}
</style>

<div id="app">
  <div id="view">
    <canvas id="screen" aria-label="Game view"></canvas>
    <button id="bMenu" type="button"><span>MENU</span><small id="bagCnt">BAG 0/40</small></button>
    <div class="hudtxt"><div id="tLvl">LV 1</div><div id="tFloor">HIDEOUT</div><div id="tFoes"></div></div>
    <div id="bossName"></div>
    <div id="log"></div>
    <div id="banner"></div>
    <div id="over" hidden>
      <div class="t">YOU DIED</div>
      <div class="sub" id="overSub">YOU LOSE SOME EXPERIENCE</div>
      <button id="again" class="bigbtn" type="button">TO THE HIDEOUT</button>
    </div>
  </div>
  <div id="pad">
    <div id="stickZone"></div>

      <button class="btn" id="bAtk" type="button"><span id="lAtk">SHOOT</span><small id="sAtk">HOLD</small></button>
      <button class="btn" id="bSkA" type="button"><span>SKILL</span><small id="sSkA">-</small></button>
      <button class="btn" id="bSkB" type="button"><span>SKILL</span><small id="sSkB">-</small></button>
      <button class="btn" id="bRoll" type="button"><span>ROLL</span><small id="sRoll">2</small></button>
      <button class="btn" id="bFlask" type="button"><span>FLASK</span><small id="sFlask">3</small></button>

  </div>
</div>

<div id="panel" hidden>
  <div id="pHead"><div id="pTitle">MENU</div><button class="btn2" id="pClose" type="button">CLOSE</button></div>
  <div id="pBody"></div>
  <div id="pNav"></div>
  <div id="sheetBg" hidden data-a="sheetclose"></div>
  <div id="sheet" hidden role="dialog" aria-label="Item details"><div id="sheetTop"><i></i><button class="btn2 sm" data-a="sheetclose" type="button">CLOSE</button></div><div id="sheetBody"></div></div>
</div>
<script>
(()=>{
'use strict';
/* =====================================================================
   SPIRE: portrait pixel ARPG, PoE1 systems in a small package.
   World = flat grid. Iso is only a draw-time projection.
   ===================================================================== */
let W=144,H=160;                           // internal pixel size, set by fit() to an integer fraction of the screen
const TW=8,TH=6,WH=7,RXK=TW*Math.SQRT2,RYK=TH*Math.SQRT2;   // iso tile 16x12 (steeper, closer to top-down), wall height 7
const DNG='#ff5a2e';                       // the one danger colour: telegraphs, hazards, enemy projectiles
const $=id=>document.getElementById(id);
const cv=$('screen'); cv.width=W; cv.height=H;
const g=cv.getContext('2d',{alpha:false});
g.imageSmoothingEnabled=false;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>{a=Math.ceil(a);b=Math.floor(b);if(b<a)b=a;return Math.floor(rand(a,b+1));};
const fl=Math.floor;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(list,wf){let t=0;for(const x of list)t+=wf(x);let r=Math.random()*t;for(const x of list){r-=wf(x);if(r<=0)return x;}return list[list.length-1];}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),gg=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1);}

/* ---------- palettes ---------- */
const BIOMES=[
  {name:'MOSSY DEPTHS',bg:'#0b1510',floor:'#35594a',dot:'#294638',wt:'#7fa285',wl:'#4a6e5b',wr:'#2b4538'},
  {name:'EMBER HALLS', bg:'#170d0c',floor:'#5c3b32',dot:'#4a2e27',wt:'#b0795f',wl:'#764a3d',wr:'#452920'},
  {name:'FROST VAULTS',bg:'#0a121c',floor:'#3e5d7b',dot:'#304c66',wt:'#a5c4de',wl:'#5f86a6',wr:'#3a5873'}
];
const HIDE={name:'HIDEOUT',bg:'#120d14',floor:'#6b5a49',dot:'#594a3b',wt:'#a89377',wl:'#7a6851',wr:'#4c4033'};
let BIO=HIDE;
const RC={normal:'#c8c8c8',magic:'#8888ff',rare:'#ffff77',unique:'#af6025'};
const TYPECOL={phys:'#e8e8e8',fire:'#ff9a3a',cold:'#8fd8ff',light:'#fff06a',chaos:'#c27aff'};

/* ---------- audio (synthesized) ---------- */
let ac=null;
function ensureAudio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
}
function tone(f,d,type,slide,vol){
  if(!ac||(SAVE&&SAVE.opt&&!SAVE.opt.sfx))return;
  try{
    const o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;
    o.type=type||'square';
    o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    gn.gain.setValueAtTime(vol||.05,t);
    gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn);gn.connect(ac.destination);
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  shoot:()=>tone(720,.05,'square',-380,.025),
  hit:()=>tone(180,.05,'square',-60,.035),
  kill:()=>tone(300,.09,'square',500,.04),
  hurt:()=>tone(150,.22,'sawtooth',-90,.08),

/* 1px dark outline around every opaque pixel (canvas needs a 1px transparent margin) */
function outlineCanvas(c,col){
  const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data;
  const A=(i,j)=>(i<0||j<0||i>=w||j>=h)?0:d[(j*w+i)*4+3];
  x.fillStyle=col;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!A(i,j)&&(A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1)))x.fillRect(i,j,1,1);
  return c;
}
/* Player: three views (f=toward camera, b=away, s=side, mirrored for left) x five frames (0 idle, 1-4 walk cycle) */
function buildHuman(a,view,fr){
  const c=mkc(12,16),x=c.getContext('2d');
  const R=(px,py,w,h,col)=>{x.fillStyle=col;x.fillRect(px+1,py+1,w,h);};
  const hair=a.hair,skin=a.skin,cl=a.cloth,cd=shade(a.cloth,.62),pant=shade(a.cloth,.42),pantF=shade(a.cloth,.3);
  const boot='#3a2a22',bootF='#2a1e18',eye='#1a1420',belt='#2a2030';
  if(view==='s'){
    const sw=fr===1?1:(fr===3?-1:0);
    let farX=3,nearX=5,nearL=4,farL=4;
    if(fr===1){farX=2;nearX=6;}
    else if(fr===3){farX=6;nearX=2;}
    else if(fr===2){farX=4;nearX=4;nearL=3;}
    else if(fr===4){farX=4;nearX=4;farL=3;}
    R(farX,10,2,farL,pantF);R(farX,9+farL,2,1,bootF);
    R(nearX,10,2,nearL,pant);R(nearX,9+nearL,2,1,boot);
    R(3,5,4,4,cl);R(3,9,4,1,belt);
    R(3,0,4,1,hair);R(2,1,6,1,hair);R(2,2,3,1,hair);R(5,2,3,1,skin);R(2,3,2,1,hair);R(4,3,4,1,skin);R(5,4,2,1,skin);
    x.fillStyle=eye;x.fillRect(7,3,1,1);
    R(4+sw,5,2,3,cd);R(4+sw,8,2,1,skin);
  }else{
    const back=view==='b';
    let lL=4,lR=4,aL=0,aR=0;
    if(fr===1){lR=3;aL=1;aR=-1;}else if(fr===3){lL=3;aL=-1;aR=1;}
    R(3,10,2,lL,pant);R(3,9+lL,2,1,boot);
    R(5,10,2,lR,pant);R(5,9+lR,2,1,boot);
    R(2,5,6,4,cl);R(2,9,6,1,belt);
    if(!back)R(4,7,2,1,cd);
    R(1,5+aL,1,3,cd);R(1,8+aL,1,1,skin);
    R(8,5+aR,1,3,cd);R(8,8+aR,1,1,skin);
    if(back){R(3,0,4,1,hair);R(2,1,6,3,hair);R(4,4,2,1,skin);}
    else{
      R(3,0,4,1,hair);R(2,1,6,1,hair);R(2,2,1,2,hair);R(7,2,1,2,hair);R(3,2,4,2,skin);R(4,4,2,1,skin);
      x.fillStyle=eye;x.fillRect(4,4,1,1);x.fillRect(7,4,1,1);
    }
  }
  return outlineCanvas(c,'#1a1420');
}
function buildRoll(a,fr){
  const c=mkc(12,12),x=c.getContext('2d');
  const cl=a.cloth,cd=shade(a.cloth,.62);
  for(let j=0;j<8;j++)for(let i=0;i<8;i++){const d=Math.hypot(i-3.5,j-3.5);if(d<=3.8){x.fillStyle=d>2.9?cd:cl;x.fillRect(i+2,j+2,1,1);}}
  const ang=fr*Math.PI/2+.8;
  x.fillStyle=a.skin;x.fillRect(Math.round(5.5+Math.cos(ang)*2.3),Math.round(5.5+Math.sin(ang)*2.3),2,2);
  x.fillStyle=a.hair;x.fillRect(Math.round(5.5+Math.cos(ang+Math.PI)*2.3),Math.round(5.5+Math.sin(ang+Math.PI)*2.3),2,2);
  return outlineCanvas(c,'#1a1420');
}

const CRE={
  husk:  {w:12,h:11,hw:6, hh:4,tw:8, th:4, aw:2,al:5, lw:2,ll:3,body:'#6c5a7c',eye:DNG,es:1},

  warden:{w:26,h:26,hw:10,hh:7,tw:16,th:10,aw:4,al:11,lw:4,ll:9,body:'#5a4a9a',eye:DNG,es:2,crown:'#ffd23a'}

const OUTC={n:'#241a2b',m:'#4d6bff',r:'#ffd23a'};
function buildBiped(o,pose,fr,outc){
  const IW=o.w,IH=o.h,c=mkc(IW+2,IH+2),x=c.getContext('2d');
  const R=(px,py,w,h,col)=>{x.fillStyle=col;x.fillRect(px+1,py+1,w,h);};
  const dark=shade(o.body,.62),mid=shade(o.body,.8);
  const hx=Math.round((IW-o.hw)/2),tx=Math.round((IW-o.tw)/2);
  const ll=o.ll;let lL=ll,lR=ll,aL=0,aR=0,top=0;
  if(pose==='walk'){if(fr===0){lR=ll-1;aL=1;aR=-1;}else if(fr===2){lL=ll-1;aL=-1;aR=1;}}
  else if(pose==='wind'){aL=aR=-Math.min(o.hh,Math.ceil(o.al*.6));}
  else if(pose==='act'){aL=aR=1;}
  else if(pose==='rec'){top=Math.max(1,ll>>2);lL=lR=ll-top;}
  const legY=o.hh+o.th+top,ay=a=>Math.max(0,o.hh+top+a);
  const lg=Math.round(o.tw*.12);
  R(tx+lg,legY,o.lw,lL,dark);R(tx+o.tw-o.lw-lg,legY,o.lw,lR,dark);
  R(tx,o.hh+top,o.tw,o.th,o.body);R(tx,o.hh+top+o.th-1,o.tw,1,mid);
  R(tx-o.aw,ay(aL),o.aw,o.al,o.body);R(tx-o.aw,ay(aL)+o.al-1,o.aw,1,dark);
  R(tx+o.tw,ay(aR),o.aw,o.al,o.body);R(tx+o.tw,ay(aR)+o.al-1,o.aw,1,dark);
  R(hx,top,o.hw,o.hh,o.body);
  const ey=top+Math.max(1,o.hh>>1);
  R(hx+1,ey,o.es,o.es,o.eye);R(hx+o.hw-1-o.es,ey,o.es,o.es,o.eye);
  if(o.mouth)R(hx+1,top+o.hh-1,o.hw-2,1,dark);
  if(o.horn){R(hx-1,top,1,2,o.horn);R(hx+o.hw,top,1,2,o.horn);}
  if(o.crown){R(hx,top,o.hw,1,o.crown);for(let i=0;i<o.hw;i+=2)R(hx+i,top+1,1,1,o.crown);}
  return outlineCanvas(c,outc);
}

function baseFor(slot,ilvl){

function tierIdxFor(a,ilvl){
  const ok=[];
  for(let i=0;i<5;i++){if(TIER_IL[i]<=ilvl&&(!a.minTier||i>=a.minTier))ok.push(i);}
  if(!ok.length)return -1;
  return wpick(ok,i=>TIER_W[i]);
}
function rollVal(a,ti){
  const m=TIER_MULT[ti];
  if(a.rr)return [ri(Math.round(a.rr[0][0]*m),Math.round(a.rr[0][1]*m)),ri(Math.round(a.rr[1][0]*m),Math.round(a.rr[1][1]*m))];
  if(a.dec)return Math.round(rand(a.r[0]*m,a.r[1]*m)*10)/10;
  return ri(Math.round(a.r[0]*m),Math.round(a.r[1]*m));
}
function rollMapVal(a){return a.r[1]===a.r[0]?a.r[0]:ri(a.r[0],a.r[1]);}
function modCaps(it){return it.rarity==='magic'?1:(it.rarity==='rare'?3:0);}
function countSide(it,t){return it.mods.filter(m=>m.t===t).length;}
function addRandomMod(it){
  const cap=modCaps(it);
  const sides=[];
  if(countSide(it,'p')<cap)sides.push('p');
  if(countSide(it,'s')<cap)sides.push('s');
  if(!sides.length)return false;
  for(let tries=0;tries<2;tries++){
    const side=sides.length>1?pick(sides):sides[0];
    const used=it.mods.map(m=>m.a);
    const pool=affixList(it).filter(a=>a.t===side&&!used.includes(a.id)&&(it.kind==='map'||a.s.includes(it.slot)));
    const usable=[];
    for(const a of pool){const ti=it.kind==='map'?0:tierIdxFor(a,it.ilvl);if(ti>=0)usable.push({a,ti});}
    if(usable.length){
      const pk=wpick(usable,u=>u.a.w||50);
      const a=pk.a;
      it.mods.push({a:a.id,t:a.t,tier:pk.ti,v:it.kind==='map'?rollMapVal(a):rollVal(a,pk.ti)});
      return true;
    }
    const other=side==='p'?'s':'p';
    if(sides.includes(other)){sides.length=0;sides.push(other);}else break;
  }
  return false;
}
function setRarity(it,r){it.rarity=r;it.mods=[];if(r==='rare'&&!it.rn)it.rn=pick(RARE_A)+' '+pick(RARE_B[slotType(it.slot)]||['Thing']);}

/* ---------- crafting orbs ---------- */
function sockCap(it){return MAXSOCK[slotType(it.slot)]||0;}
function applyOrb(it,id){
  if(!it||(it.kind!=='gear'&&it.kind!=='map'))return {ok:false,msg:'Choose a gear item or map first.'};
  const r=it.rarity,isMap=it.kind==='map';
  const fail=m=>({ok:false,msg:m}),ok=m=>({ok:true,msg:m});
  const mods=n=>{for(let i=0;i<n;i++)addRandomMod(it);};
  const rareN=()=>wpick([4,5,6],x=>x===4?55:(x===5?30:15));
  switch(id){
    case 'transmute':
      if(r!=='normal')return fail('Needs a Normal item.');
      setRarity(it,'magic');mods(Math.random()<.5?1:2);return ok('Item became Magic.');
    case 'alteration':
      if(r!=='magic')return fail('Needs a Magic item.');
      it.mods=[];mods(Math.random()<.5?1:2);return ok('Magic modifiers rerolled.');
    case 'augment':
      if(r!=='magic')return fail('Needs a Magic item.');
      if(it.mods.length>=2)return fail('Magic item already has 2 modifiers.');
      mods(1);return ok('Added a modifier.');
    case 'alchemy':
      if(r!=='normal')return fail('Needs a Normal item.');
      setRarity(it,'rare');mods(rareN());return ok('Item became Rare.');
    case 'regal':
      if(r!=='magic')return fail('Needs a Magic item.');
      it.rarity='rare';if(!it.rn)it.rn=pick(RARE_A)+' '+pick(RARE_B[slotType(it.slot)]||['Relic']);mods(1);return ok('Item became Rare.');
    case 'chaos':
      if(r!=='rare')return fail('Needs a Rare item.');
      it.mods=[];mods(rareN());if(it.mods.length<4)mods(3);return ok('Rare modifiers rerolled.');
    case 'exalt':
      if(r!=='rare')return fail('Needs a Rare item.');
      if(it.mods.length>=6)return fail('Item already has 6 modifiers.');
      mods(1);return ok('Added a modifier.');
    case 'scour':
      if(r==='unique')return fail('Cannot scour a Unique.');
      if(r==='normal')return fail('Item has no modifiers.');
      it.mods=[];it.rarity='normal';return ok('Item reset to Normal.');
    case 'divine':
      if(r==='normal')return fail('Item has no modifiers to reroll.');
      if(r==='unique'){
        if(!it.fixed)return fail('Nothing to reroll.');

function cleanSave(o){
  const walk=v=>{
    if(typeof v==='string')return v.replace(/[<>&"'`]/g,'').slice(0,80);
    if(Array.isArray(v))return v.map(walk);
    if(v&&typeof v==='object'){const r={};for(const k of Object.keys(v))r[k.replace(/[<>&"'`]/g,'')]=walk(v[k]);return r;}
    return v;
  };
  const s=walk(o);
  if(!s||s.v!==1||typeof s.eq!=='object'||!s.eq||!Array.isArray(s.inv)||!Array.isArray(s.stash)||!Array.isArray(s.pass))return null;
  if(typeof s.lvl!=='number'||typeof s.xp!=='number'||typeof s.best!=='number'||!s.cur||typeof s.cur!=='object')return null;
  s.lvl=clamp(Math.floor(s.lvl),1,MAX_LVL);

}

function computeStats(){
  const m=collectMods(),s=m.sum,L=SAVE.lvl;
  const S={s,lo:m.lo,hi:m.hi,more:m.more};

function incPct(S,type,tags){

  if(type==='light')p+=(s.inc_light||0)+(s.inc_elem||0);
  if(tags.includes('spell'))p+=s.inc_spell||0;
  if(tags.includes('attack'))p+=s.inc_attack||0;

const TYPES=['phys','fire','cold','light','chaos'];
function attackProfile(){

  lo.phys=w.phys[0]+(S.lo.add_phys_attack||0);hi.phys=w.phys[1]+(S.hi.add_phys_attack||0);

function buildSkill(a,sups){
  const d=ACTIVE[a.gid],S=ST,lm=1+.12*(a.lvl-1),s=S.s;
  let mm=1,more=1,moreElem=1,areaMul=1,projN=1,castInc=0,critInc=0,noail=false;
  const addLo={},addHi={},used=[];

    used.push(sp.gid);

    areaMul*=1+(sd.area||0);projN+=sd.proj||0;castInc+=sd.cast||0;critInc+=sd.crit||0;
    if(sd.noail)noail=true;

    lo+=(addLo[t]||0)*lm;hi+=(addHi[t]||0)*lm;
    if(t==='fire'||t==='cold'||t==='light'){lo+=S.lo['add_'+t+'_spell']||0;hi+=S.hi['add_'+t+'_spell']||0;}
    if(!(hi>0))continue;
    const el=(t==='fire'||t==='cold'||t==='light');
    const f=(1+incPct(S,t,d.tags)/100)*more*S.moreAll*(el?moreElem:1);
    dmg[t]={lo:lo*f,hi:hi*f};avg+=(lo+hi)/2*f;

  return {gem:a,def:d,gid:a.gid,name:d.n,dmg,avg,
    mana:Math.round(d.mana*(1+.03*(a.lvl-1))*mm),cd:d.cd/cs,
    radius:(d.radius||0)*(1+(s.inc_area||0)/100)*areaMul,proj:projN,
    crit:6*(1+((s.crit_chance||0)+critInc)/100),critMulti:1.5+(s.crit_multi||0)/100,
    igniteCh:noail?0:15+(s.ignite_chance||0),shockCh:noail?0:15+(s.shock_chance||0),noail,sups:used};
}

function bfsDist(src){
  const d=new Int16Array(MW*MH).fill(-1),q=[src];d[src]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h];
    for(const nb of [c-1,c+1,c-MW,c+MW]){
      if(nb>=0&&nb<map.length&&map[nb]===0&&d[nb]<0){d[nb]=d[c]+1;q.push(nb);}
    }
  }
  return d;
}
function farthest(d){let b=-1,bi=0;for(let i=0;i<d.length;i++)if(d[i]>b){b=d[i];bi=i;}return bi;}
function finishMap(){
  vis=new Uint8Array(MW*MH);variant=new Uint8Array(MW*MH);
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    const i=y*MW+x;
    variant[i]=(Math.imul(x*73856093^y*19349663,2654435761)>>>28)&7;
    if(map[i]===1){
      let v=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(map[(y+dy)*MW+x+dx]===0)v=1;
      vis[i]=v;
    }
  }
}
function genFloor(seed){
  for(let attempt=0;attempt<30;attempt++){
    const r=rng(seed+attempt*977);
    let m=new Uint8Array(MW*MH);
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)m[y*MW+x]=(x<1||y<1||x>=MW-1||y>=MH-1||r()<0.44)?1:0;
    for(let it=0;it<4;it++){
      const n=new Uint8Array(MW*MH);
      for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
        if(x<1||y<1||x>=MW-1||y>=MH-1){n[y*MW+x]=1;continue;}
        let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)c+=m[(y+dy)*MW+x+dx];
        n[y*MW+x]=c>=5?1:0;
      }
      m=n;
    }
    const lab=new Int16Array(MW*MH);let best=0,bestId=0,id=0;
    for(let i=0;i<m.length;i++){
      if(m[i]===0&&lab[i]===0){
        id++;let cnt=0;const st=[i];lab[i]=id;
        while(st.length){
          const c=st.pop();cnt++;
          for(const nb of [c-1,c+1,c-MW,c+MW]){if(m[nb]===0&&lab[nb]===0){lab[nb]=id;st.push(nb);}}
        }
        if(cnt>best){best=cnt;bestId=id;}
      }
    }
    if(best<650)continue;
    for(let i=0;i<m.length;i++)if(m[i]===0&&lab[i]!==bestId)m[i]=1;
    map=m;
    let any=0;for(let i=0;i<m.length;i++)if(m[i]===0){any=i;break;}
    const a=farthest(bfsDist(any));
    const b=farthest(bfsDist(a));
    const db=bfsDist(b);
    finishMap();
    const maxD=db[a];
    const cand=[];
    for(let i=0;i<m.length;i++)if(m[i]===0&&db[i]>=14&&db[i]<=maxD-5)cand.push(i);
    for(let i=cand.length-1;i>0;i--){const j=(r()*(i+1))|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
    const packs=[];
    for(const c of cand){
      const x=c%MW,y=(c/MW)|0;
      if(packs.every(p=>Math.hypot(p.x-x,p.y-y)>=8))packs.push({x,y,d:db[c]});
      if(packs.length>=13)break;
    }
    return{start:{x:b%MW,y:(b/MW)|0},exit:{x:a%MW,y:(a/MW)|0},packs};
  }
  return null;
}

function blockedBox(x,y,r){return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r);}
function moveEnt(e,dx,dy){
  const nx=e.x+dx;if(!blockedBox(nx,e.y,e.r))e.x=nx;
  const ny=e.y+dy;if(!blockedBox(e.x,ny,e.r))e.y=ny;
}
function los(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/.35);
  for(let i=1;i<n;i++){const t=i/n;if(solidAt(x1+(x2-x1)*t,y1+(y2-y1)*t))return false;}
  return true;
}
function buildFlow(px,py){
  flow.fill(30000);
  let h=0,t=0;const s=py*MW+px;flow[s]=0;flowQ[t++]=s;
  while(h<t){
    const c=flowQ[h++],d=flow[c]+1;
    for(const nb of [c-1,c+1,c-MW,c+MW]){if(map[nb]===0&&flow[nb]>d){flow[nb]=d;flowQ[t++]=nb;}}
  }
}
function flowDir(e){
  const ix=e.x|0,iy=e.y|0;
  let best=flow[iy*MW+ix],bx=ix,by=iy;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const nx=ix+dx,ny=iy+dy;
    if(map[ny*MW+nx])continue;
    if(dx&&dy&&(map[iy*MW+nx]||map[ny*MW+ix]))continue;
    const v=flow[ny*MW+nx];
    if(v<best){best=v;bx=nx;by=ny;}
  }
  return{x:bx+.5,y:by+.5};
}

/* ---------- flow of the game ---------- */

  P.rollT=0;P.hurtCd=0;P.atkT=0;P.flaskHeal=0;P.skCd=[0,0];

function enterFloor(f,mapItem){
  mode='tower';floorN=f;BIO=biomeFor(f);
  resetCombatState();
  FM=mapItem?mapVals(mapItem):{m_dmg:0,m_life:0,m_pack:0,m_rare:0,m_speed:0,m_frail:0,iiq:0,iir:0};
  runSeed=(Math.random()*1e9)|0;
  const seed=(runSeed^Math.imul(f,2654435761))>>>0;
  const G=genFloor(seed);
  dmgScale=(1+.08*(f-1))*(1+FM.m_dmg/100);hpScale=1+.18*(f-1);
  P.x=G.start.x+.5;P.y=G.start.y+.5;
  if(P.life>ST.life)P.life=ST.life;
  exitTile=G.exit;
  seen=new Uint8Array(MW*MH);stairsSeen=false;
  const boss=f%5===0;
  const baseCount=Math.min(5+f,11);
  const target=Math.round(baseCount*(1+FM.m_pack/100));
  const packs=G.packs.slice(0,Math.min(target,G.packs.length));
  const n=packs.length;
  const rareCount=(f>=3?2:1)+FM.m_rare;
  const rareIdx=new Set();
  while(rareIdx.size<Math.min(rareCount,Math.max(0,n-1)))rareIdx.add(1+((Math.random()*(n-1))|0));
  packs.forEach((c,i)=>{
    if(rareIdx.has(i)){
      spawnAround(c,'brute',i,'rare');spawnAround(c,'husk',i);spawnAround(c,'spitter',i);
    }else{
      const sizes=[['husk','husk','spitter'],['husk','spitter','spitter'],['husk','husk','husk']];
      const comp=pick(sizes).slice();
      if(f>=3)comp.push(Math.random()<.5?'husk':'spitter');
      comp.forEach(t=>spawnAround(c,t,i,Math.random()<.15?'magic':'normal'));
    }
  });
  if(boss){
    const bx=exitTile.x+.5,by=exitTile.y+.5;
    let b=null;
    for(let r=2.5;r<5&&!b;r+=.5){
      for(let k=0;k<12&&!b;k++){
        const a=rand(0,6.28),x=bx+Math.cos(a)*r,y=by+Math.sin(a)*r;
        if(!blockedBox(x,y,1.2)){b=mkEnemy('warden',x,y,99,'rare');enemies.push(b);}
      }
    }
    if(!b){b=mkEnemy('warden',bx+1,by+1,99,'rare');enemies.push(b);}
    bossRef=b;
  }
  const sp=toWorldPx(P.x,P.y);camX=sp.x;camY=sp.y;
  lastTile=-1;flowT=0;
  state='play';$('over').hidden=true;
  banner(boss?'FLOOR '+f+'  -  THE WARDEN':'FLOOR '+f+'  '+BIO.name,2600);
  if(mapItem)logMsg('Map mods: +'+FM.iiq+'% item quantity','#8888ff');
}
function nextFloor(){
  sfx.stairs();
  SAVE.best=Math.max(SAVE.best,floorN);
  P.life=Math.min(ST.life,P.life+ST.life*.25);P.mana=ST.mana;P.flaskCh=ST.flaskMax;
  markSave();
  enterFloor(floorN+1,null);
}
function die(){
  state='dead';

  SAVE.xp=Math.max(0,SAVE.xp-Math.round(need*.1));
  $('overSub').textContent='YOU LOSE 10% OF YOUR LEVEL EXPERIENCE';

}

/* ---------- helpers ---------- */
function toGrid(sx,sy){const gx=3*sx+4*sy,gy=4*sy-3*sx,l=Math.hypot(gx,gy)||1;return{x:gx/l,y:gy/l};}   // screen direction -> grid direction for a 16x12 tile
function toWorldPx(gx,gy){return{x:(gx-gy)*TW,y:(gx+gy)*TH};}
let OX=0,OY=0;
function scr(gx,gy){return{x:Math.round((gx-gy)*TW)+OX,y:Math.round((gx+gy)*TH)+OY};}
function invuln(){return P.rollT>0&&(ROLL_T-P.rollT)<IFRAMES;}
function nearestEnemy(x,y,range,needLos){
  let best=null,bd=range;
  for(const e of enemies){
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<bd&&(!needLos||los(x,y,e.x,e.y))){bd=d;best=e;}
  }
  return best;
}
function getMove(){
  let x=input.sx,y=input.sy;
  const k=input.keys;
  const kx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),ky=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);x=kx/l;y=ky/l;}
  return{x,y};
}
let dispScale=2.7;
function aimTarget(){
  const a=input.aim;
  if(a.active&&Math.hypot(a.dx,a.dy)>14){
    const sx=a.dx/dispScale*2.5,sy=a.dy/dispScale*2.5;
    let gx=(sx/TW+sy/TH)/2,gy=(sy/TH-sx/TW)/2;
    const l=Math.hypot(gx,gy);
    if(l>SKILL_RANGE){gx*=SKILL_RANGE/l;gy*=SKILL_RANGE/l;}
    return{x:P.x+gx,y:P.y+gy,manual:true};
  }
  const t=nearestEnemy(P.x,P.y,SKILL_RANGE,false);
  if(t)return{x:t.x,y:t.y,manual:false};
  return{x:P.x+P.fx*4.5,y:P.y+P.fy*4.5,manual:false};
}
function addNum(x,y,v,col){if(!SAVE.opt.nums)return;nums.push({x,y,t:0,v:Math.round(v),c:col});}
function burst(x,y,n,c1,c2){
  for(let i=0;i<n;i++)parts.push({x,y,z:5,vx:rand(-3,3),vy:rand(-3,3),vz:rand(15,45),t:0,l:rand(.3,.6),c:Math.random()<.5?c1:c2});
}
function mixDmg(dm){let best='phys',bv=-1;for(const t in dm)if(dm[t]>bv){bv=dm[t];best=t;}return best;}

/* ---------- player taking damage ---------- */
function hurtPlayer(d,type){
  if(state!=='play'||P.hurtCd>0||invuln())return false;
  let dmg=d,t=type;
  if(t==='ele')t=BIOELE[fl((floorN-1)/5)%3];
  if(t==='phys'){const red=ST.armour/(ST.armour+10*d);dmg=d*(1-Math.min(.9,red));}
  else{const res=clamp(ST.res[t]||0,-100,75);dmg=d*(1-res/100);}
  dmg=Math.max(1,Math.round(dmg));
  P.hurtCd=.45;P.esDelay=2.5;
  let rest=dmg;
  if(P.es>0){const a=Math.min(P.es,rest);P.es-=a;rest-=a;}
  P.life-=rest;
  hitstop=.035;
  if(SAVE.opt.shake&&dmg>=ST.life*.15)shake=Math.max(shake,1.5);
  addNum(P.x,P.y,dmg,DNG);
  sfx.hurt();
  if(P.life<=0){P.life=0;die();}
  return true;
}

/* ---------- player dealing damage ---------- */
function rollDamage(dmgTab){
  const out={};
  for(const t in dmgTab){out[t]=rand(dmgTab[t].lo,dmgTab[t].hi);}
  return out;
}
function dealToEnemy(e,dm,crit,opt){
  opt=opt||{};
  let mult=1;
  if(e.state==='rec')mult*=1.3;
  if(e.shock>0)mult*=1.2;
  if(FM.m_frail)mult*=1+FM.m_frail/100;
  if(crit)mult*=opt.critMulti||1.5;
  let total=0;
  for(const t in dm){dm[t]*=mult;total+=dm[t];}
  e.hp-=total;if(SAVE.opt.flash)e.flash=.05;
  addNum(e.x,e.y,total,TYPECOL[mixDmg(dm)]);
  sfx.hit();
  if(!opt.noail){
    if(dm.fire>0&&Math.random()*100<(opt.igniteCh||0)){const dps=dm.fire*.5;if(!e.ign||dps>=e.ign.dps)e.ign={dps,t:4,tick:0};}
    if(dm.cold>0){e.chill=2;}
    if(dm.light>0&&Math.random()*100<(opt.shockCh||0))e.shock=4;
  }
  if(e.state==='idle')wakePack(e);
  if(e.hp<=0)killEnemy(e);
}
function wakePack(e){
  for(const o of enemies){
    if(o.pack===e.pack&&o.state==='idle'){o.state='chase';for(const id of o.T.patterns)o.cds[id]=.6;}
  }
}

/* ---------- loot ---------- */
function rarityRoll(tier,iir){
  const boost=1+iir/100;
  let w={normal:62,magic:30,rare:7.5,unique:.5};
  if(tier==='magic')w={normal:35,magic:50,rare:14,unique:1};
  if(tier==='rare')w={normal:15,magic:40,rare:42,unique:3};
  w.magic*=boost;w.rare*=boost;w.unique*=boost;
  return wpick(['normal','magic','rare','unique'],r=>w[r]);
}
function rollCurrency(alvl){
  const pool=CUR_ORDER.filter(id=>CUR[id].il<=alvl);
  return wpick(pool,id=>CUR[id].w);
}
function dropAt(x,y,obj){drops.push({x:x+rand(-.6,.6),y:y+rand(-.6,.6),obj,t:0});}
function dropLoot(e){
  const alvl=areaLevel(floorN),q=1+FM.iiq/100,tier=e.tier,boss=e.T.boss;
  const itemCh=(tier==='rare'?1:(tier==='magic'?.34:.11))*q;
  const curCh=(tier==='rare'?1:(tier==='magic'?.5:.2))*q;
  const nItems=boss?4:(tier==='rare'?2:1),nCur=boss?4:(tier==='rare'?2:1);
  for(let i=0;i<nItems;i++){
    if(Math.random()<itemCh||boss){
      let it;
      const slot=wpick(Object.keys(SLOTWEIGHT),s=>SLOTWEIGHT[s]);
      const rar=boss&&i===0?'rare':rarityRoll(tier,FM.iir);
      if(rar==='unique'){it=newUnique(slot,alvl);if(!it)it=newGear(slot,alvl,'rare');}
      else it=newGear(slot,alvl,rar);
      if(it.rarity==='normal'&&SAVE.opt.hideNormal)continue;
      dropAt(e.x,e.y,{item:it});
    }
  }
  for(let i=0;i<nCur;i++)if(Math.random()<curCh||boss)dropAt(e.x,e.y,{cur:rollCurrency(alvl),n:1});
  if(Math.random()<(tier==='rare'?.25:(tier==='magic'?.07:.03))*q||boss){
    const sup=Math.random()<.55,ids=Object.keys(sup?SUPP:ACTIVE);
    dropAt(e.x,e.y,{item:newGem(pick(ids),sup)});
  }
  if(boss||Math.random()<(tier==='rare'?.2:.03)*q){
    const f=Math.min(floorN+1,Math.max(1,SAVE.best+1));
    const r=rarityRoll('magic',FM.iir);
    dropAt(e.x,e.y,{item:newMap(boss?Math.max(1,floorN+1):Math.max(1,floorN),r==='unique'?'rare':(r==='normal'?'normal':r))});
  }
}
function bagCount(){return SAVE.inv.length;}
function addToInv(it){
  if(SAVE.inv.length>=INV_CAP)return false;
  SAVE.inv.push(it);markSave();return true;
}
function pickupDrops(){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.t+=STEP;
    if(Math.hypot(d.x-P.x,d.y-P.y)>.85||d.t<.35)continue;
    if(d.obj.cur){
      SAVE.cur[d.obj.cur]=(SAVE.cur[d.obj.cur]||0)+d.obj.n;
      logMsg('+ '+CUR[d.obj.cur].n,CUR[d.obj.cur].c);sfx.pick();drops.splice(i,1);markSave();
    }else{
      if(addToInv(d.obj.item)){logMsg('+ '+itemTitle(d.obj.item),rarCol(d.obj.item));sfx.pick();drops.splice(i,1);}
      else if(T-fullMsgT>2){fullMsgT=T;logMsg('INVENTORY FULL','#ff7a6a');}
    }
  }
}
function addXp(n){
  SAVE.xp+=n;
  let up=false;
  while(SAVE.lvl<MAX_LVL&&SAVE.xp>=xpNeed(SAVE.lvl)){SAVE.xp-=xpNeed(SAVE.lvl);SAVE.lvl++;up=true;}
  if(up){
    computeStats();computeSkills();
    P.life=ST.life;P.mana=ST.mana;
    banner('LEVEL '+SAVE.lvl+'  +1 PASSIVE POINT',2200);sfx.level();
    logMsg('Level '+SAVE.lvl,'#ffd23a');
  }
}
function gemXp(n){
  const seen2=new Set();
  for(const s of SK){
    if(seen2.has(s.gem.id))continue;seen2.add(s.gem.id);
    const gm=s.gem;
    if(gm.lvl>=20)continue;
    gm.xp+=n;
    while(gm.lvl<20&&gm.xp>=gemNeed(gm.lvl)){
      gm.xp-=gemNeed(gm.lvl);gm.lvl++;
      computeSkills();
      logMsg(gemDef(gm).n+' reached level '+gm.lvl,'#6fe08f');
      break;
    }
  }
}
function killEnemy(e){
  const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);
  for(let k=hazards.length-1;k>=0;k--)if(hazards[k].owner===e&&!hazards[k].persist)hazards.splice(k,1);
  burst(e.x,e.y,e.T.rare?16:8,'#d6cce8','#8a7a9a');
  dropLoot(e);
  const mult=e.tier==='rare'?1:(e.tier==='magic'?3:1);
  const xp=Math.round(e.T.xp*(1+floorN*.35)*(e.tier==='magic'?3:1));
  addXp(xp);gemXp(Math.round(xp*.8));
  P.flaskKills+=e.T.rare?3:1;
  while(P.flaskKills>=3){P.flaskKills-=3;if(P.flaskCh<ST.flaskMax)P.flaskCh++;}
  if(SAVE.opt.shake&&e.T.rare)shake=Math.max(shake,1.5);
  sfx.kill();
  if(e===bossRef){bossRef=null;banner('THE WARDEN FALLS  -  THE STAIRS ARE OPEN',3000);$('bossName').textContent='';SAVE.best=Math.max(SAVE.best,floorN);markSave();}
}

/* ---------- enemy attack patterns ---------- */
function addHazard(h){h.t=0;h.state='wind';h.hit=false;h.hitCd=0;hazards.push(h);}
function inHazard(h,p){
  if(h.shape==='c')return Math.hypot(p.x-h.x,p.y-h.y)<=h.r+p.r*.8;
  const vx=h.x2-h.x1,vy=h.y2-h.y1,l2=vx*vx+vy*vy||1;
  let t=((p.x-h.x1)*vx+(p.y-h.y1)*vy)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(h.x1+vx*t),p.y-(h.y1+vy*t))<=h.w/2+p.r*.8;
}
function startPattern(e,id,pt){
  e.state='wind';e.t=0;e.pt=pt;e.pid=id;
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
  e.face=(nx-ny)>=0?1:-1;
  const dmg=pt.dmg*dmgScale*(e.tier==='magic'?1.1:1)*(e.T.boss?1:1);
  if(pt.kind==='circle'){
    const at=pt.at==='self'?{x:e.x,y:e.y}:{x:P.x,y:P.y};
    addHazard({shape:'c',x:at.x,y:at.y,r:pt.radius,tw:pt.wind,ta:pt.hAct||pt.act,dmg,dtype:pt.type,tick:pt.tick,owner:e,persist:!!pt.persist});
  }else if(pt.kind==='zones'){
    for(let i=0;i<pt.count;i++){
      let zx=P.x,zy=P.y;
      if(i>0){const a=rand(0,6.283),r=rand(1.5,3.6);zx+=Math.cos(a)*r;zy+=Math.sin(a)*r;if(solidAt(zx,zy)){zx=P.x;zy=P.y;}}
      addHazard({shape:'c',x:zx,y:zy,r:pt.radius,tw:pt.wind+i*.1,ta:pt.hAct,dmg,dtype:pt.type,tick:pt.tick,owner:e,persist:true});
    }
  }else if(pt.kind==='capsule'){
    e.sx=e.x;e.sy=e.y;
    let len=0;
    while(len<pt.length&&!blockedBox(e.sx+nx*(len+.3),e.sy+ny*(len+.3),e.r*.8))len+=.3;
    e.ex=e.sx+nx*len;e.ey=e.sy+ny*len;
    addHazard({shape:'k',x1:e.sx,y1:e.sy,x2:e.ex,y2:e.ey,w:pt.width,tw:pt.wind,ta:pt.act,dmg,dtype:pt.type,owner:e});
  }else if(pt.kind==='fan'){
    const base=Math.atan2(dy,dx),dirs=[];
    for(let i=0;i<pt.count;i++)dirs.push(base+(i-(pt.count-1)/2)*pt.spread);
    e.fanDirs=dirs;
    addHazard({shape:'r',vis:true,x:e.x,y:e.y,dirs,tw:pt.wind,ta:0,owner:e});
  }
  if(d<11)sfx.tell();
}
function activatePattern(e){
  const pt=e.pt;
  if(pt.kind==='fan'&&e.fanDirs){
    for(const a of e.fanDirs)projs.push({x:e.x,y:e.y,vx:Math.cos(a)*pt.speed,vy:Math.sin(a)*pt.speed,r:.22,life:3.4,dmg:pt.dmg*dmgScale,dtype:pt.type,hostile:true});
  }
}
function enemyUpdate(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.mv=false;
  if(e.chill>0)e.chill-=dt;
  if(e.shock>0)e.shock-=dt;
  if(e.ign){
    e.ign.t-=dt;e.ign.tick-=dt;
    if(e.ign.tick<=0){e.ign.tick=.5;e.hp-=e.ign.dps*.5;addNum(e.x,e.y,e.ign.dps*.5,TYPECOL.fire);if(e.hp<=0){killEnemy(e);return;}}
    if(e.ign.t<=0)e.ign=null;
  }
  for(const k in e.cds)if(e.cds[k]>0)e.cds[k]-=dt;
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||.001;
  if(Math.abs(dx-dy)>.05)e.face=(dx-dy)>=0?1:-1;
  const slow=e.chill>0?.7:1;
  if(e.state==='idle'){
    if(d<e.T.aggro&&(d<5||los(e.x,e.y,P.x,P.y))){e.state='chase';wakePack(e);}
    return;
  }
  if(e.state==='chase'){
    const sight=los(e.x,e.y,P.x,P.y);
    const hpf=e.hp/e.maxhp;
    for(const id of e.T.patterns){
      const pt=PAT[id];
      if(e.cds[id]>0)continue;
      if(d>pt.range||d<(pt.minRange||0))continue;
      if(!sight&&pt.kind!=='zones')continue;
      startPattern(e,id,pt);return;
    }
    let tx=P.x,ty=P.y;
    if(!sight){const f=flowDir(e);tx=f.x;ty=f.y;}
    let mx=tx-e.x,my=ty-e.y;const ml=Math.hypot(mx,my)||1;mx/=ml;my/=ml;
    let sp=e.T.speed*e.spd*slow*(e.T.boss&&hpf<.5?1.25:1);
    if(e.T.keep){
      e.strafeT-=dt;if(e.strafeT<=0){e.strafe*=-1;e.strafeT=rand(1.2,2.8);}
      if(d<e.T.keep-.8){mx=-dx/d;my=-dy/d;}
      else if(d<e.T.keep+1.4&&sight){mx=-dy/d*e.strafe;my=dx/d*e.strafe;sp*=.55;}
    }else if(d<e.r+P.r+.25)sp=0;
    const ox=e.x,oy=e.y;moveEnt(e,mx*sp*dt,my*sp*dt);
    const md=Math.hypot(e.x-ox,e.y-oy);if(md>.001){e.wk+=md;e.mv=true;}
  }else if(e.state==='wind'){
    e.t+=dt;
    if(e.t>=e.pt.wind){e.state='act';e.t=0;activatePattern(e);}
  }else if(e.state==='act'){
    e.t+=dt;
    if(e.pt.move){
      const k=Math.min(1,e.t/e.pt.act);
      moveEnt(e,e.sx+(e.ex-e.sx)*k-e.x,e.sy+(e.ey-e.sy)*k-e.y);
    }
    if(e.t>=e.pt.act){e.state='rec';e.t=0;}
  }else if(e.state==='rec'){
    e.t+=dt;
    const mul=(e.T.boss&&e.hp/e.maxhp<.5)?.6:1;
    if(e.t>=e.pt.rec*mul){e.state='chase';e.cds[e.pid]=e.pt.cd*mul;}
  }
}

/* ---------- player skills ---------- */
function skillHit(sk,e,ex){
  const dm=rollDamage(sk.dmg);
  const crit=Math.random()*100<sk.crit;
  dealToEnemy(e,dm,crit,{critMulti:sk.critMulti,igniteCh:sk.igniteCh,shockCh:sk.shockCh,noail:sk.noail});
}
function aoeDamage(x,y,r,sk){
  for(const e of enemies.slice())if(Math.hypot(e.x-x,e.y-y)<=r+e.r*.6)skillHit(sk,e);
}
function castSkill(i,tgt){
  const sk=SK[i];
  if(!sk){sfx.nope();return;}
  if(P.skCd[i]>0||P.mana<sk.mana){sfx.nope();return;}
  P.mana-=sk.mana;P.skCd[i]=sk.cd;P.skMax[i]=sk.cd;
  const d=sk.def;
  const dx=tgt.x-P.x,dy=tgt.y-P.y,l=Math.hypot(dx,dy)||1;
  if(l>.1){P.fx=dx/l;P.fy=dy/l;}
  sfx.skill();
  if(d.chain){
    const first=nearestEnemy(tgt.x,tgt.y,4,false)||nearestEnemy(P.x,P.y,d.range,true);
    if(!first)return;
    const hit=new Set(),pts=[{x:P.x,y:P.y}];
    let cur=first;
    for(let c=0;c<d.chains&&cur;c++){
      hit.add(cur);pts.push({x:cur.x,y:cur.y});
      skillHit(sk,cur);
      let nxt=null,bd=4.5;
      for(const o of enemies){if(hit.has(o))continue;const dd=Math.hypot(o.x-cur.x,o.y-cur.y);if(dd<bd){bd=dd;nxt=o;}}
      cur=nxt;
    }
    bolts.push({pts,t:.18});
  }else if(d.self){
    pending.push({x:P.x,y:P.y,t:d.delay,total:d.delay,r:sk.radius,sk,col:TYPECOL.cold});
  }else if(d.speed){
    const base=Math.atan2(dy,dx),n=sk.proj;
    for(let k=0;k<n;k++){
      const a=base+(k-(n-1)/2)*.22;
      projs.push({x:P.x,y:P.y,vx:Math.cos(a)*d.speed,vy:Math.sin(a)*d.speed,r:.25,life:1.3,hostile:false,sk});
    }
  }else{
    pending.push({x:tgt.x,y:tgt.y,t:d.delay,total:d.delay,r:sk.radius,sk,col:TYPECOL.fire});
  }
}
function elemColOf(sk){return sk.dmg.fire?TYPECOL.fire:(sk.dmg.cold?TYPECOL.cold:(sk.dmg.light?TYPECOL.light:TYPECOL.phys));}
function explodeProj(p){
  const sk=p.sk;
  aoeDamage(p.x,p.y,sk.radius,sk);
  burst(p.x,p.y,8,elemColOf(sk),'#ffffff');
  sfx.boom();
}

/* ---------- main step ---------- */
function step(dt){
  T+=dt;
  shake=Math.max(0,shake-dt*10);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;if(p.t>=p.l){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=120*dt;if(p.z<0){p.z=0;p.vz=0;}
  }
  for(let i=nums.length-1;i>=0;i--){nums[i].t+=dt;if(nums[i].t>1)nums.splice(i,1);}
  for(let i=bolts.length-1;i>=0;i--){bolts[i].t-=dt;if(bolts[i].t<=0)bolts.splice(i,1);}
  while(logLines.length&&T-logLines[0].t>5)logLines.shift();
  if(state!=='play')return;

  const mv=getMove(),mag=Math.hypot(mv.x,mv.y);
  let gdx=0,gdy=0;
  if(mag>.12){const gv=toGrid(mv.x,mv.y);gdx=gv.x;gdy=gv.y;}
  P.moving=mag>.12;
  P.hurtCd=Math.max(0,P.hurtCd-dt);
  P.skCd[0]=Math.max(0,P.skCd[0]-dt);P.skCd[1]=Math.max(0,P.skCd[1]-dt);
  P.mana=Math.min(ST.mana,P.mana+Math.max(5,ST.mana*.1)*dt);
  P.dodge=Math.min(ST.dodgeCharges,P.dodge+dt/ST.dodgeRecharge);
  if(ST.regen&&P.life>0)P.life=Math.min(ST.life,P.life+ST.regen*dt);
  P.esDelay=Math.max(0,P.esDelay-dt);
  if(P.esDelay<=0&&P.es<ST.es)P.es=Math.min(ST.es,P.es+ST.es*.25*dt);
  if(P.es>ST.es)P.es=ST.es;
  if(P.life>ST.life)P.life=ST.life;
  const px0=P.x,py0=P.y;
  if(input.roll){
    input.roll=false;
    if(P.rollT<=0&&P.dodge>=1){
      P.dodge-=1;P.rollT=ROLL_T;
      P.rdx=mag>.12?gdx:P.fx;P.rdy=mag>.12?gdy:P.fy;
      sfx.roll();
    }
  }
  if(input.flask){
    input.flask=false;
    if(mode==='tower'&&P.flaskCh>0&&P.flaskHeal<=0&&P.life<ST.life){P.flaskCh--;P.flaskHeal=3;sfx.flask();}else sfx.nope();
  }
  if(P.flaskHeal>0){const h=Math.min(P.flaskHeal,dt);P.flaskHeal-=h;P.life=Math.min(ST.life,P.life+ST.life*.45/3*h);}
  if(P.rollT>0){
    P.rollT-=dt;
    const sp=ROLL_DIST/ROLL_T;
    moveEnt(P,P.rdx*sp*dt,P.rdy*sp*dt);
  }else{
    moveEnt(P,gdx*ST.moveSpeed*dt,gdy*ST.moveSpeed*dt);
    if(mag>.12){P.fx=gdx;P.fy=gdy;}
  }

  {
    const tp=toWorldPx(P.x,P.y);camX=tp.x;camY=tp.y;
    // walk cycle driven by distance actually travelled; view = which way the sprite faces on screen
    const mvd=Math.hypot(P.x-px0,P.y-py0);
    P.wmove=P.rollT<=0&&P.moving&&mvd>.002;
    if(P.wmove)P.walk+=mvd;
    const sxv=(P.fx-P.fy)*TW,syv=(P.fx+P.fy)*TH,ax=Math.abs(sxv),ay=Math.abs(syv);
    if(P.view==='s'){if(ay>ax*1.35)P.view=syv>0?'f':'b';}
    else if(ax>ay*1.35)P.view='s';
    else P.view=syv>0?'f':'b';
    if(ax>.01)P.sflip=sxv<0;
  }

  if(mode==='hideout'){
    nearProp=null;let bd=1.9;
    for(const pr of PROPS){const d=Math.hypot(pr.x-P.x,pr.y-P.y);if(d<bd){bd=d;nearProp=pr;}}
    if(input.use){input.use=false;if(nearProp&&typeof window.__openProp==='function')window.__openProp(nearProp.id);}
    return;
  }
  input.use=false;

  // attack (wand)
  P.atkT-=dt;
  if(input.attack&&P.rollT<=0&&P.atkT<=0){
    const tgt=nearestEnemy(P.x,P.y,7.5,true)||nearestEnemy(P.x,P.y,5,false);
    let dx=P.fx,dy=P.fy;
    if(tgt){dx=tgt.x-P.x;dy=tgt.y-P.y;}
    const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    if(tgt){P.fx=dx;P.fy=dy;}
    const ap=attackProfile();
    const dm=rollDamage(ap.dmg);
    const crit=Math.random()*100<ap.crit;
    projs.push({x:P.x,y:P.y,vx:dx*12,vy:dy*12,r:.2,life:.7,hostile:false,dm,crit,critMulti:ap.critMulti,igniteCh:15+(ST.s.ignite_chance||0),shockCh:15+(ST.s.shock_chance||0),col:dm.fire?TYPECOL.fire:(dm.cold?TYPECOL.cold:(dm.light?TYPECOL.light:'#e8e8e8'))});
    P.atkT=1/ap.aps;
    sfx.shoot();
  }
  for(let i=0;i<2;i++)if(input.cast[i]){const c=input.cast[i];input.cast[i]=null;castSkill(skIdx(i),c);}

  for(let i=pending.length-1;i>=0;i--){
    const s=pending[i];s.t-=dt;
    if(s.t<=0){
      pending.splice(i,1);
      aoeDamage(s.x,s.y,s.r,s.sk);
      burst(s.x,s.y,12,s.col,'#ffffff');
      if(SAVE.opt.shake)shake=Math.max(shake,1);
      sfx.boom();
    }
  }

  flowT-=dt;
  const tile=(P.y|0)*MW+(P.x|0);
  if(tile!==lastTile||flowT<=0){buildFlow(P.x|0,P.y|0);lastTile=tile;flowT=.4;}
  seenT-=dt;
  if(seenT<=0){
    seenT=.15;
    const px=P.x|0,py=P.y|0;
    for(let y=py-9;y<=py+9;y++)for(let x=px-9;x<=px+9;x++){
      if(x<0||y<0||x>=MW||y>=MH)continue;
      if((x-px)*(x-px)+(y-py)*(y-py)<=81)seen[y*MW+x]=1;
    }
    if(!stairsSeen){
      const ex=exitTile.x+.5,ey=exitTile.y+.5,dd=Math.hypot(ex-P.x,ey-P.y);
      if(dd<9&&(dd<3.5||los(P.x,P.y,ex,ey))){
        stairsSeen=true;sfx.pick();
        logMsg(bossRef?'You found the stairs. They are sealed.':'You found the stairs.',bossRef?'#ff9a8a':'#ffd23a');
      }
    }
  }

  for(const e of enemies.slice())enemyUpdate(e,dt);
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i],b=enemies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>.001){
      const push=(m-d)/2,ux=dx/d,uy=dy/d;
      if(a.state!=='act')moveEnt(a,-ux*push,-uy*push);
      if(b.state!=='act')moveEnt(b,ux*push,uy*push);
    }
  }

  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];h.t+=dt;
    if(h.state==='wind'&&h.t>=h.tw){
      h.state='act';h.t=0;
      if(h.vis){hazards.splice(i,1);continue;}
    }else if(h.state==='act'&&h.t>=h.ta){hazards.splice(i,1);continue;}
    if(h.state==='act'&&!h.vis){
      if(inHazard(h,P)){
        if(h.tick){h.hitCd-=dt;if(h.hitCd<=0&&hurtPlayer(h.dmg,h.dtype))h.hitCd=h.tick;}
        else if(!h.hit&&hurtPlayer(h.dmg,h.dtype))h.hit=true;
      }else if(h.tick&&h.hitCd>0)h.hitCd-=dt;
    }
  }

  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    p.life-=dt;
    if(p.life<=0){if(p.sk)explodeProj(p);projs.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(solidAt(p.x,p.y)){if(p.sk)explodeProj(p);projs.splice(i,1);continue;}
    if(p.hostile){
      if(Math.hypot(p.x-P.x,p.y-P.y)<p.r+P.r&&hurtPlayer(p.dmg,p.dtype)){projs.splice(i,1);continue;}
    }else{
      let hit=null;
      for(const e of enemies)if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+.15){hit=e;break;}
      if(hit){
        projs.splice(i,1);
        if(p.sk)explodeProj(p);
        else dealToEnemy(hit,Object.assign({},p.dm),p.crit,{critMulti:p.critMulti,igniteCh:p.igniteCh,shockCh:p.shockCh});
      }
    }
  }

  pickupDrops();

  const sealed=bossRef!==null;
  if(!sealed&&Math.hypot(P.x-(exitTile.x+.5),P.y-(exitTile.y+.5))<.9)nextFloor();
}

/* ===================== RENDERING ===================== */
const DROWS=[2,4,8,10,12,16,16,12,10,8,4,2];       // 16 x 12 diamond: the top face of a tile
function dia(cx,cy){for(let j=0;j<12;j++){const w=DROWS[j];g.fillRect(cx-(w>>1),cy-6+j,w,1);}}
function ellipseHalf(rx,ry,dy){const t=1-(dy*dy)/(ry*ry);return t<=0?0:Math.round(rx*Math.sqrt(t));}
function fillEllipse(cx,cy,rx,ry,col,alpha){
  g.globalAlpha=alpha==null?1:alpha;g.fillStyle=col;
  const R=Math.max(1,Math.round(ry));
  for(let dy=-R;dy<=R;dy++){const h=ellipseHalf(rx,R,dy);g.fillRect(cx-h,cy+dy,h*2+1,1);}
  g.globalAlpha=1;
}
function outlineEllipse(cx,cy,rx,ry,col,alpha){
  g.globalAlpha=alpha==null?1:alpha;g.fillStyle=col;
  const R=Math.max(1,Math.round(ry));
  for(let dy=-R;dy<=R;dy++){
    const h=ellipseHalf(rx,R,dy),a=dy>-R?ellipseHalf(rx,R,dy-1):-1,b=dy<R?ellipseHalf(rx,R,dy+1):-1;
    const inner=Math.min(a,b);
    if(inner<0){g.fillRect(cx-h,cy+dy,h*2+1,1);}
    else{const w=Math.max(1,Math.min(3,h-inner+1));g.fillRect(cx-h,cy+dy,w,1);g.fillRect(cx+h-w+1,cy+dy,w,1);}
  }
  g.globalAlpha=1;
}
function fillPoly(pts,col,alpha){
  g.globalAlpha=alpha==null?1:alpha;g.fillStyle=col;
  let y0=1e9,y1=-1e9;
  for(const p of pts){y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  y0=Math.max(0,Math.floor(y0));y1=Math.min(H-1,Math.ceil(y1));
  for(let y=y0;y<=y1;y++){
    let xa=1e9,xb=-1e9;
    for(let i=0;i<pts.length;i++){
      const p=pts[i],q=pts[(i+1)%pts.length];
      if((p.y<=y+.5&&q.y>y+.5)||(q.y<=y+.5&&p.y>y+.5)){
        const x=p.x+(q.x-p.x)*((y+.5-p.y)/(q.y-p.y));
        xa=Math.min(xa,x);xb=Math.max(xb,x);
      }
    }
    if(xb>=xa)g.fillRect(Math.round(xa),y,Math.max(1,Math.round(xb-xa)),1);
  }
  g.globalAlpha=1;
}
function pline(x0,y0,x1,y1,col,dot,alpha){
  g.globalAlpha=alpha==null?1:alpha;g.fillStyle=col;
  x0|=0;y0|=0;x1|=0;y1|=0;
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let err=dx-dy,n=0;
  for(;;){
    if(!dot||(n&2)===0)g.fillRect(x0,y0,1,1);
    n++;
    if(x0===x1&&y0===y1||n>600)break;
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
  }
  g.globalAlpha=1;
}
const DIG={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111'};
function drawNum(v,x,y,col){
  const s=String(v);
  for(let pass=0;pass<2;pass++){
    g.fillStyle=pass===0?'#000':col;
    const o=pass===0?1:0;
    for(let i=0;i<s.length;i++){
      const gl=DIG[s[i]];if(!gl)continue;
      for(let k=0;k<15;k++)if(gl[k]==='1')g.fillRect(x+i*4+(k%3)+o,y+((k/3)|0)+o,1,1);
    }
  }
}

/* ---------- telegraphs: steady fills, no flicker ---------- */
function drawHazard(h){
  if(h.shape==='c'){
    const p=scr(h.x,h.y),rx=Math.round(h.r*RXK),ry=Math.round(h.r*RYK);
    if(h.state==='wind'){
      const prog=Math.min(1,h.t/h.tw);
      fillEllipse(p.x,p.y,rx,ry,DNG,.2);
      if(prog>.04)fillEllipse(p.x,p.y,Math.max(2,rx*prog),Math.max(1,ry*prog),DNG,.38);
      outlineEllipse(p.x,p.y,rx,ry,DNG,1);
    }else{
      fillEllipse(p.x,p.y,rx,ry,DNG,h.tick?.5:.85);
      outlineEllipse(p.x,p.y,rx,ry,DNG,1);
    }
  }else if(h.shape==='k'){
    const dx=h.x2-h.x1,dy=h.y2-h.y1,l=Math.hypot(dx,dy)||1,px=-dy/l*h.w/2,py=dx/l*h.w/2;
    const quad=k=>[scr(h.x1+px*k,h.y1+py*k),scr(h.x2+px*k,h.y2+py*k),scr(h.x2-px*k,h.y2-py*k),scr(h.x1-px*k,h.y1-py*k)];
    if(h.state==='wind'){
      const prog=Math.min(1,h.t/h.tw),q=quad(1);
      fillPoly(q,DNG,.2);
      fillPoly(quad(Math.max(.1,prog)),DNG,.35);
      for(let i=0;i<4;i++)pline(q[i].x,q[i].y,q[(i+1)%4].x,q[(i+1)%4].y,DNG,false,1);
    }else fillPoly(quad(1),DNG,.85);
  }else if(h.shape==='r'){
    const p=scr(h.x,h.y);
    for(const a of h.dirs){const q=scr(h.x+Math.cos(a)*5,h.y+Math.sin(a)*5);pline(p.x,p.y,q.x,q.y,DNG,true,.8);}
  }
}

/* ---------- world drawing ---------- */
function biomeCols(){
  if(!BIO._d)BIO._d={fd:shade(BIO.floor,.5),wl:shade(BIO.wl,.5),wr:shade(BIO.wr,.5),wt:shade(BIO.wt,.5),bg:BIO.bg};
  return BIO._d;
}
/* one wall block: left face, right face, lit top. dark = not explored yet */
function drawWall(cx,cy,dark){
  const h=WH,D=biomeCols();
  g.fillStyle=dark?D.wl:BIO.wl;
  for(let i=0;i<8;i++){const ye=cy+((i*TH/TW)|0);g.fillRect(cx-8+i,ye-h,1,h+1);}
  g.fillStyle=dark?D.wr:BIO.wr;
  for(let i=0;i<8;i++){const yb=cy+TH-1-((i*TH/TW)|0);g.fillRect(cx+i,yb-h,1,h+1);}
  g.fillStyle=BIO.bg;
  for(let i=0;i<8;i++){g.fillRect(cx-8+i,cy+((i*TH/TW)|0),1,1);}
  g.fillRect(cx-8,cy-h,1,h+1);
  g.fillStyle=dark?D.wt:BIO.wt;dia(cx,cy-h);
}
function dropColor(o){
  if(o.cur)return CUR[o.cur].c;
  return rarCol(o.item);
}
const seenAt=(x,y)=>seen[(y|0)*MW+(x|0)]===1;
function render(){
  const sh=(SAVE.opt.shake&&shake>.3)?shake:0;
  const shx=sh?Math.round(rand(-sh,sh)):0,shy=sh?Math.round(rand(-sh,sh)):0;
  // the camera is locked to the player, so the player sits on a fixed screen pixel and the world scrolls in whole pixels
  OX=(W>>1)-Math.round(camX)+shx;OY=(H>>1)-Math.round(camY)+shy;
  const D=biomeCols();
  g.fillStyle=BIO.bg;g.fillRect(0,0,W,H);

  // pass 1: ground (explored tiles bright, unexplored tiles dark)
  for(let pass=0;pass<2;pass++){
    g.fillStyle=pass?D.fd:BIO.floor;
    for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
      const i=y*MW+x;if(map[i])continue;
      const sn=seen[i]===1;if(pass===0?!sn:sn)continue;
      const cx=(x-y)*TW+OX,cy=(x+y+1)*TH+OY;
      if(cx<-8||cx>W+8||cy<-6||cy>H+6)continue;
      dia(cx,cy);
    }
  }
  g.fillStyle=BIO.dot;
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    const i=y*MW+x;if(map[i]||seen[i]!==1)continue;
    const v=variant[i];if(v>2)continue;
    const cx=(x-y)*TW+OX,cy=(x+y+1)*TH+OY;
    if(cx<-8||cx>W+8||cy<-6||cy>H+6)continue;
    if(v===0)g.fillRect(cx-3,cy,2,1);else if(v===1)g.fillRect(cx+2,cy-1,2,1);else g.fillRect(cx-1,cy+1,1,1);
  }
  if(mode==='tower'&&stairsSeen){
    const p=scr(exitTile.x+.5,exitTile.y+.5),sealed=bossRef!==null;
    g.fillStyle=sealed?'#6a5a5a':'#fff3b8';dia(p.x,p.y);
    g.fillStyle=sealed?'#4a3a3a':'#e0b84a';
    g.fillRect(p.x-6,p.y-3,12,6);

    g.fillStyle=sealed?'#8a6a6a':'#ffffff';g.fillRect(p.x-1,p.y-1,2,2);
  }
  for(const h of hazards)drawHazard(h);
  for(const s of pending){
    const p=scr(s.x,s.y),k=s.t/s.total,rx=Math.round(s.r*RXK),ry=Math.round(s.r*RYK);
    fillEllipse(p.x,p.y,rx,ry,'#9fe8ff',.15);
    outlineEllipse(p.x,p.y,rx,ry,'#9fe8ff',.9);
    fillEllipse(p.x,p.y,Math.max(1,rx*(1-k)),Math.max(1,ry*(1-k)),'#9fe8ff',.25);
  }
  if(input.aim.active){
    const sk=SK[input.aim.idx];
    const t=aimTarget(),p=scr(t.x,t.y),rr=sk?sk.radius:2;
    const rx=Math.round(rr*RXK),ry=Math.round(rr*RYK);
    fillEllipse(p.x,p.y,rx,ry,'#9fe8ff',.12);
    outlineEllipse(p.x,p.y,rx,ry,t.manual?'#ffffff':'#9fe8ff',.9);
    g.fillStyle='#ffffff';g.fillRect(p.x-2,p.y,5,1);g.fillRect(p.x,p.y-2,1,5);
  }
  // shadows
  const seenEn=enemies.filter(e=>mode==='hideout'||seenAt(e.x,e.y));
  g.fillStyle='#000';g.globalAlpha=.35;
  const ps=scr(P.x,P.y);g.fillRect(ps.x-4,ps.y-1,9,1);g.fillRect(ps.x-3,ps.y,7,1);
  for(const e of seenEn){
    const p=scr(e.x,e.y),w=e.T.scale>=2?(e.T.scale*3):5;
    g.fillRect(p.x-w,p.y-1,w*2+1,1);g.fillRect(p.x-w+1,p.y,w*2-1,1);
  }
  for(const p of projs){const q=scr(p.x,p.y);g.fillRect(q.x,q.y,2,1);}
  g.globalAlpha=1;
  for(const d of drops){if(!seenAt(d.x,d.y))continue;const q=scr(d.x,d.y);g.fillStyle='#000';g.globalAlpha=.35;g.fillRect(q.x-2,q.y+1,5,1);g.globalAlpha=1;}

  // pass 2: walls and entities in depth order
  const items=[];
  items.push({d:fl(P.x)+fl(P.y),k:P.x+P.y,f:drawPlayer});
  for(const e of seenEn)items.push({d:fl(e.x)+fl(e.y),k:e.x+e.y,f:()=>drawEnemy(e)});
  for(const p of projs)items.push({d:fl(p.x)+fl(p.y),k:p.x+p.y,f:()=>drawProj(p)});
  for(const p of parts)items.push({d:fl(p.x)+fl(p.y),k:p.x+p.y,f:()=>drawPart(p)});
  for(const d of drops)if(seenAt(d.x,d.y))items.push({d:fl(d.x)+fl(d.y),k:d.x+d.y,f:()=>drawDrop(d)});
  if(mode==='hideout')for(const pr of PROPS)items.push({d:fl(pr.x)+fl(pr.y),k:pr.x+pr.y,f:()=>drawProp(pr)});
  items.sort((a,b)=>a.d-b.d||a.k-b.k);
  let ip=0;
  for(let d=0;d<=MW+MH-2;d++){
    const x0=Math.max(0,d-MH+1),x1=Math.min(d,MW-1);
    for(let x=x0;x<=x1;x++){
      const y=d-x,i=y*MW+x;
      if(!map[i]||!vis[i])continue;
      const cx=(x-y)*TW+OX,cy=(x+y+1)*TH+OY;
      if(cx<-8||cx>W+8||cy<-6||cy>H+WH+14)continue;
      drawWall(cx,cy,seen[i]!==1);
    }
    while(ip<items.length&&items[ip].d<=d){items[ip].f();ip++;}
  }
  while(ip<items.length){items[ip].f();ip++;}
  // walls can stand in front of things: redraw the player and enemies as ghosts, and projectiles solid, on top of the walls
  if(mode==='tower'){
    g.globalAlpha=.5;drawPlayer();for(const e of seenEn)drawEnemy(e);g.globalAlpha=1;
    for(const p of projs)drawProj(p);
  }

  // lightning bolts
  for(const b of bolts){
    for(let i=1;i<b.pts.length;i++){
      const a=scr(b.pts[i-1].x,b.pts[i-1].y),c=scr(b.pts[i].x,b.pts[i].y);

  // stairs beacon: only once you have actually found the stairs
  if(mode==='tower'&&stairsSeen){
    const p=scr(exitTile.x+.5,exitTile.y+.5),sealed=bossRef!==null;
    if(!sealed){
      g.fillStyle='#000';g.globalAlpha=.4;g.fillRect(p.x-6,p.y-58,1,58);g.fillRect(p.x+6,p.y-58,1,58);
      g.fillStyle='#fff3b8';
      g.globalAlpha=.3;g.fillRect(p.x-5,p.y-58,11,58);
      g.globalAlpha=.5;g.fillRect(p.x-3,p.y-58,7,58);
      g.globalAlpha=.9;g.fillRect(p.x-1,p.y-58,3,58);
      g.globalAlpha=1;
      fillEllipse(p.x,p.y,14,10,'#fff3b8',.35);
      outlineEllipse(p.x,p.y,14,10,'#fff3b8',.9);
    }else{
      g.fillStyle='#000';g.globalAlpha=.4;g.fillRect(p.x-4,p.y-36,1,36);g.fillRect(p.x+4,p.y-36,1,36);
      g.fillStyle='#ff9a8a';g.globalAlpha=.4;g.fillRect(p.x-3,p.y-36,7,36);
      g.globalAlpha=.7;g.fillRect(p.x-1,p.y-36,3,36);g.globalAlpha=1;
      outlineEllipse(p.x,p.y,10,7,'#ff9a8a',.8);
    }
  }
  for(const n of nums){
    const p=scr(n.x,n.y),rise=Math.round(n.t*10);
    drawNum(n.v,p.x-((String(n.v).length*4-1)>>1),p.y-22-rise,n.c);
  }
  drawHUD();
}

const STRIDE=.42;                              // world units per walk frame
function drawPlayer(){

function drawEnemy(e){
  const p=scr(e.x,e.y),T0=e.T;
  let pose='idle',fr=0;
  if(e.state==='wind')pose='wind';
  else if(e.state==='act')pose='act';

  const hh=img.height-2,top=p.y-hh;
  sprite(img,p.x-(img.width>>1),top-(e.state==='act'&&e.pt&&e.pt.move?2:0),e.face<0);

function drawProp(pr){

function drawProj(p){

function drawPart(p){const q=scr(p.x,p.y);g.fillStyle=p.c;g.fillRect(q.x,q.y-Math.round(p.z),2,2);}
function drawDrop(d){

function drawMinimap(){

const panel=$('panel'),pBody=$('pBody'),pNav=$('pNav'),pTitle=$('pTitle'),sheetEl=$('sheet'),sheetBg=$('sheetBg'),sheetBody=$('sheetBody');
const ui={page:'hero',menu:true,sheet:null,msg:'',craft:null,towerFloor:1,towerMap:null,confirm:null,tsel:null,list:0,quick:1,lastTab:'hero'};
const skIdx=b=>SAVE.opt.swap?(b===0?1:0):b;
function hasGem(it){return it.gs&&it.gs.some(x=>x);}

/* ---------- inventory logic ---------- */
function findItem(id){
  const hosts=[];
  for(const s of SLOTS)if(SAVE.eq[s])hosts.push({it:SAVE.eq[s],w:'eq',slot:s});
  for(const it of SAVE.inv)hosts.push({it,w:'inv'});
  for(const it of SAVE.stash)hosts.push({it,w:'stash'});
  for(const h of hosts){
    if(h.it.id===id)return h;
    if(h.it.gs)for(let i=0;i<h.it.gs.length;i++){const gm=h.it.gs[i];if(gm&&gm.id===id)return{it:gm,w:'sock',host:h.it,idx:i,hw:h.w};}
  }
  return null;
}
function removeFrom(w,it){
  const arr=w==='inv'?SAVE.inv:SAVE.stash;
  const i=arr.indexOf(it);if(i>=0)arr.splice(i,1);
}
function ringSlot(){return !SAVE.eq.ring1?'ring1':(!SAVE.eq.ring2?'ring2':'ring1');}
function equipItem(id,target){
  const f=findItem(id);
  if(!f||f.it.kind!=='gear'||f.w==='eq'||f.w==='sock')return 'Cannot equip that.';
  const it=f.it,slot=target||(it.slot==='ring'?ringSlot():it.slot);
  if(slotType(slot)!==slotType(it.slot))return 'That item does not fit that slot.';
  removeFrom(f.w,it);
  const old=SAVE.eq[slot];SAVE.eq[slot]=it;
  if(old)(f.w==='inv'?SAVE.inv:SAVE.stash).push(old);
  recomputeAll();markSave();return '';
}
function unequip(slot){
  const it=SAVE.eq[slot];if(!it)return '';
  if(SAVE.inv.length>=INV_CAP)return 'Your bag is full.';
  delete SAVE.eq[slot];SAVE.inv.push(it);recomputeAll();markSave();return '';
}
function gemFits(gm,col){return col==='W'||gm.col===col;}
function socketGem(hostId,idx,gemId){
  const hf=findItem(hostId),gf=findItem(gemId);
  if(!hf||!gf||gf.w==='sock')return 'Gem not available.';
  const host=hf.it,gm=gf.it;
  if(host.gs[idx])return 'Socket is already filled.';
  if(!gemFits(gm,host.sockets[idx]))return 'Gem colour does not match the socket.';
  removeFrom(gf.w,gm);host.gs[idx]=gm;recomputeAll();markSave();return '';
}
function unsocketGem(hostId,idx){
  const hf=findItem(hostId);if(!hf)return '';
  const host=hf.it,gm=host.gs[idx];if(!gm)return '';
  if(SAVE.inv.length>=INV_CAP)return 'Your bag is full.';
  host.gs[idx]=null;SAVE.inv.push(gm);recomputeAll();markSave();return '';
}
const KORD={gear:0,gem:1,map:2},RORD={unique:0,rare:1,magic:2,normal:3};
function sortBag(){
  SAVE.inv.sort((a,b)=>(KORD[a.kind]-KORD[b.kind])||String(a.slot||a.gid||'').localeCompare(String(b.slot||b.gid||''))||((RORD[a.rarity]||0)-(RORD[b.rarity]||0))||((b.ilvl||b.floor||b.lvl||0)-(a.ilvl||a.floor||a.lvl||0))||(a.id-b.id));
  markSave();
}
function doSell(it){
  const rw=itemSellRewards(it);
  removeFrom('inv',it);
  for(const r of rw)SAVE.cur[r[0]]=(SAVE.cur[r[0]]||0)+r[1];
  markSave();return rw;
}
function rewardText(list){return list.map(r=>CUR[r[0]].n+(r[1]>1?' x'+r[1]:'')).join(', ');}

/* ---------- compare: what would change if this was equipped ---------- */
function statSnap(){
  const ap=attackProfile();let avg=0;for(const t in ap.dmg)avg+=(ap.dmg[t].lo+ap.dmg[t].hi)/2;
  const sk=SK[skIdx(0)];
  return [['LIFE',ST.life],['SHIELD',ST.es],['MANA',ST.mana],['ARMOUR',ST.armour],['FIRE RES',ST.res.fire],['COLD RES',ST.res.cold],['LIGHT RES',ST.res.light],['SPEED',Math.round(ST.moveSpeed/4.6*100)],['ATTACK DPS',Math.round(avg*ap.aps)],['SKILL DMG',sk?Math.round(sk.avg):0]];
}
function compareHtml(it){
  if(it.kind!=='gear')return '';
  const slot=it.slot==='ring'?ringSlot():it.slot,cur=SAVE.eq[slot];
  if(cur&&cur.id===it.id)return '';
  let before,after;
  const old=SAVE.eq[slot];
  try{
    before=statSnap();
    SAVE.eq[slot]=it;computeStats();computeSkills();
    after=statSnap();
  }finally{
    if(old)SAVE.eq[slot]=old;else delete SAVE.eq[slot];
    computeStats();computeSkills();
  }
  let chips='';
  for(let i=0;i<before.length;i++){
    const d=after[i][1]-before[i][1];
    if(d)chips+=`<span class="${d>0?'up':'dn'}">${after[i][0]} ${d>0?'+':''}${d}</span>`;
  }
  return `<div class="sec" style="margin-top:14px"><span>IF YOU EQUIP IT</span><span class="dim">vs ${cur?itemTitle(cur):'empty slot'}</span></div><div class="cmp">${chips||'<span class="dim" style="border-color:var(--ui2)">NO CHANGE</span>'}</div>`;
}

/* ---------- html helpers ---------- */
const SLOT_ICON={wpn:'wand',helm:'helm',body:'body',gloves:'gloves',boots:'boots',amulet:'amulet',ring:'ring',ring1:'ring',ring2:'ring',belt:'belt'};
function itemIcon(it){return it.kind==='gem'?'gem':(it.kind==='map'?'map':(SLOT_ICON[it.slot]||'gem'));}
function icoImg(it,cls){return `<img class="${cls||'ico'}" alt="" src="${iconURL(itemIcon(it),rarCol(it))}">`;}
function dotsHtml(it,small){
  if(!it.sockets||!it.sockets.length)return '';
  return it.sockets.map((c,i)=>`<i class="sk ${c}${it.gs[i]?' has':''}${small?' sm':''}"></i>`).join('');
}
function sockDots(it){
  if(!it.sockets||!it.sockets.length)return '';
  let h='<span class="sockrow">';
  for(let i=0;i<it.sockets.length;i++){
    h+=`<i class="sk ${it.sockets[i]}${it.gs[i]?' has':''}"></i>`;
    if(i<it.sockets.length-1)h+=`<b class="lk${it.links[i]?'':' off'}"></b>`;
  }
  return h+'</span>';
}
function subText(it){
  if(it.kind==='gem')return it.sup?'SUPPORT':'SKILL';
  if(it.kind==='map')return 'T'+it.floor;
  return 'ilvl '+it.ilvl;
}
function badgeText(it){return it.kind==='gem'?(it.sup?'S':'L'+it.lvl):(it.kind==='map'?'T'+it.floor:String(it.ilvl));}
function tileHtml(it,act){
  return `<button class="tile" style="--rc:${rarCol(it)}" data-a="${act||'open'}" data-id="${it.id}" aria-label="${itemTitle(it)}">${icoImg(it)}<span class="dots">${it.kind==='gear'?dotsHtml(it,1):''}</span><span class="bd">${badgeText(it)}</span></button>`;
}
function itemRow(it,act,extra){
  return `<button class="irow" style="--rc:${rarCol(it)}" data-a="${act||'open'}" data-id="${it.id}" ${extra||''}>${icoImg(it)}<span class="iname" style="color:${rarCol(it)}">${itemTitle(it)}</span>${it.kind==='gear'?sockDots(it):''}<span class="isub">${subText(it)}</span></button>`;
}
function emptyTiles(n){let h='';for(let i=0;i<n;i++)h+='<div class="tile empty" aria-hidden="true"></div>';return h;}
function gemInfo(gm){
  const d=gemDef(gm);
  let h=`<div class="dim">${d.desc}</div>`;
  if(!gm.sup){
    h+=`<div class="prop">Level ${gm.lvl}${gm.lvl<20?` <small class="dim">(${gm.xp}/${gemNeed(gm.lvl)} xp, gains xp while socketed)</small>`:' (max)'}</div>`;
    h+=`<div class="prop">Mana cost ${Math.round(d.mana*(1+.03*(gm.lvl-1)))}</div>`;
    h+=`<div class="dim">${d.tags.join(', ')}</div>`;
  }else{
    h+=`<div class="prop">Mana cost x${d.mm}</div>`;
    if(d.need)h+=`<div class="dim">Works with ${d.need} skills</div>`;
  }
  return h;
}
function itemBody(it){
  let h='';
  if(it.kind==='gem')return gemInfo(it);
  if(it.kind==='map'){
    if(!it.mods.length)h+=`<div class="dim">No modifiers. Use orbs at the bench to add some.</div>`;
    for(const m of it.mods)h+=`<div class="mod">${modText(m,it)}</div>`;
    const v=mapVals(it);
    h+=`<div class="prop" style="margin-top:6px">Item quantity: +${v.iiq}%  Item rarity: +${v.iir}%</div>`;
    return h;
  }
  const b=BASE_BY_NAME[it.base];
  if(b){
    if(b.phys)h+=`<div class="prop">Physical damage ${b.phys[0]}-${b.phys[1]}  Attacks/s ${b.aps}  Crit ${b.crit}%</div>`;
    if(b.armour)h+=`<div class="prop">Armour ${b.armour}</div>`;
    if(b.es)h+=`<div class="prop">Energy shield ${b.es}</div>`;
    if(b.imp)h+=`<div class="imp">${fmtMod(b.imp.k,b.imp.v)}</div>`;
  }
  if(it.fixed)for(const m of it.fixed)h+=`<div class="uniq">${fmtMod(m.k,m.v)}</div>`;
  for(const m of it.mods){
    const a=AFF_BY_ID[m.a];
    h+=`<div class="mod">${fmtMod(a.k,m.v)} <small>${a.t==='p'?'prefix':'suffix'} T${5-m.tier}</small></div>`;
  }
  if(!it.mods.length&&!it.fixed)h+=`<div class="dim" style="margin-top:4px">No modifiers.</div>`;
  return h;
}
function itemSub(it){
  if(it.kind==='gem')return gemDef(it).n+' - '+(it.sup?'Support':'Active')+' gem';
  if(it.kind==='map')return 'Map - floor '+it.floor+' - '+it.rarity;
  return it.base+' - '+(SLOTNAME[it.slot]||it.slot)+' - ilvl '+it.ilvl+(it.rarity==='unique'?' - Unique':'');
}
function itemCard(it){
  return `<div class="card"><h3 style="color:${rarCol(it)}">${itemTitle(it)}</h3><div class="base">${itemSub(it)}</div>${itemBody(it)}</div>`;
}

/* ---------- character page ---------- */
function statsHtml(){
  const S=ST,ap=attackProfile();
  let avg=0;for(const t in ap.dmg)avg+=(ap.dmg[t].lo+ap.dmg[t].hi)/2;
  const row=(k,v)=>`<div><span class="dim">${k}</span><b>${v}</b></div>`;
  const red=Math.round(100*S.armour/(S.armour+200));
  return `<div class="stats">${row('Life',S.life)}${row('Energy shield',S.es)}${row('Mana',S.mana)}${row('Armour',S.armour+' ('+red+'%)')}${row('Fire res',S.res.fire+'%')}${row('Cold res',S.res.cold+'%')}${row('Lightning res',S.res.light+'%')}${row('Chaos res',S.res.chaos+'%')}${row('Move speed',Math.round(S.moveSpeed/4.6*100)+'%')}${row('Dodge rolls',S.dodgeCharges+' / '+Math.round(S.dodgeRecharge*10)/10+'s')}${row('Attack dmg',fmtNum(avg*ap.aps)+'/s')}${row('Attack speed',fmtNum(ap.aps)+'/s')}${row('Crit chance',fmtNum(ap.crit)+'%')}${row('Flask charges',S.flaskMax)}</div>`;
}
