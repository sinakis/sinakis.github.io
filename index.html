<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub</title>
    <style>
        /* Base Setup - Clean Dark Game Interface Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #2b1055, #100b26);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
            padding-top: 40px;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Fixed Row Grid Container */
        #games-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            width: 95%;
            max-width: 1200px;
            height: 65vh; 
            min-height: 400px;
        }

        /* Solid Column Button Card Layout (No Movement) */
        .game-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background: linear-gradient(180deg, rgba(67, 39, 143, 0.6) 0%, rgba(29, 14, 74, 0.9) 100%);
            border: 2px solid #573a96;
            border-radius: 4px;
            text-decoration: none;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Static Highlight on Active Selection */
        .game-card:hover {
            border-color: #ffd800;
            background: linear-gradient(180deg, rgba(82, 49, 171, 0.7) 0%, rgba(39, 20, 97, 0.95) 100%);
        }

        /* Bottom Section containing Titles */
        .game-card-info {
            width: 100%;
            background: #140d2d;
            border-top: 2px solid #573a96;
            padding: 20px 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .game-title {
            margin: 0 0 4px 0;
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        .game-subtitle {
            margin: 0;
            font-size: 0.85rem;
            color: #bfaee3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Interactive color changes matching console dashboards */
        .game-card:hover .game-card-info {
            background: #ffd800;
        }
        .game-card:hover .game-title {
            color: #140d2d;
        }
        .game-card:hover .game-subtitle {
            color: #5b4600;
        }
        
        .status-msg {
            font-size: 1.2rem;
            color: #bfaee3;
        }
    </style>
</head>
<body>

    
    <div id="games-container">
        <p class="status-msg">Loading game selection...</p>
    </div>

    <script>
        // System folders/files to filter out completely
        const IGNORED_ITEMS = ['readme.md', 'config', 'cnfg', 'index.html', 'css', 'js', 'assets', 'cname', '.git', '.github'];

        async function autoDiscoverGames() {
            const container = document.getElementById('games-container');
            
            try {
                // 🚀 Uses GitHub Pages' standard web server routing directly instead of the restricted API address
                const response = await fetch('./');
                const text = await response.text();
                
                // Parse the server layout to grab the links automatically
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));
                
                // Track folders to prevent duplicate buttons
                const foundFolders = new Set();

                links.forEach(link => {
                    let href = link.getAttribute('href');
                    if (!href) return;

                    // Clean the folder path format
                    href = href.replace(/^\.\//, '').replace(/\/\$/, '');
                    const nameLower = href.toLowerCase();

                    // Validation checks to confirm it's a game folder
                    if (
                        href && 
                        href !== '..' && 
                        !href.includes('//') && 
                        !href.includes('.') && 
                        !IGNORED_ITEMS.some(ignored => nameLower.includes(ignored))
                    ) {
                        foundFolders.add(href);
                    }
                });

                // Render the automated buttons
                if (foundFolders.size === 0) {
                    container.innerHTML = '<p class="status-msg">Drop your game folders into your GitHub repo to see them here!</p>';
                    return;
                }

                container.innerHTML = ''; // Clear status message

                foundFolders.forEach(folderName => {
                    const card = document.createElement('a');
                    card.href = `./${folderName}/`;
                    card.className = 'game-card';
                    
                    const infoBlock = document.createElement('div');
                    infoBlock.className = 'game-card-info';
                    
                    const title = document.createElement('h2');
                    title.className = 'game-title';
                    title.textContent = folderName.replace(/[-_]/g, ' '); 
                    
                    const subtitle = document.createElement('p');
                    subtitle.className = 'game-subtitle';
                    subtitle.textContent = 'Launch Game';

                    infoBlock.appendChild(title);
                    infoBlock.appendChild(subtitle);
                    card.appendChild(infoBlock);
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Auto-discovery failed, falling back safely:", error);
                container.innerHTML = '<p class="status-msg">Unable to scan folders automatically. Check your configuration.</p>';
            }
        }

        // Run instantly
        autoDiscoverGames();
    </script>
</body>
</html>
