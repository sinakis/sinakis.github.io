<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinakis Games Hub</title>
    <style>
        /* Modern, clean dark theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Container for the floating buttons */
        #games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 800px;
            padding: 20px;
        }

        /* Neat floating button style */
        .game-button {
            display: inline-block;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #6200ee, #03dac6);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease 0s;
            cursor: pointer;
            text-transform: capitalize; /* Automatically capitalizes folder names */
        }

        /* Floating hover effects */
        .game-button:hover {
            background: linear-gradient(135deg, #03dac6, #6200ee);
            box-shadow: 0 15px 20px rgba(3, 218, 198, 0.4);
            transform: translateY(-7px);
        }

        .game-button:active {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        /* Loading and error text states */
        .status-msg {
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Sinakis Games Hub</h1>
    
    <div id="games-container">
        <p class="status-msg" id="status">Scanning repository for games...</p>
    </div>

    <script>
        // Adjust these to match your GitHub username and repository name
        const GITHUB_USER = 'sinakis';
        const REPO_NAME = 'sinakis.github.io';
        
        // Files or folders you explicitly want to ignore
        const IGNORED_ITEMS = [
            'readme.md', 
            'config', 
            'cnfg', 
            'index.html', 
            'css', 
            'js', 
            'assets', 
            'cname', 
            '.git', 
            '.github'
        ];

        async function fetchGames() {
            const container = document.getElementById('games-container');
            const statusMsg = document.getElementById('status');

            try {
                // Fetch the list of files/folders in the root directory from GitHub API
                const response = await fetch(`https://github.com{GITHUB_USER}/${REPO_NAME}/contents/`);
                
                if (!response.ok) throw new Error('Failed to fetch repository data');
                
                const items = await response.json();
                
                // Clear the loading message
                container.innerHTML = '';

                // Filter items: Must be a directory and NOT in the ignored list
                const gameDirs = items.filter(item => {
                    const nameLower = item.name.toLowerCase();
                    return item.type === 'dir' && !IGNORED_ITEMS.some(ignored => nameLower.includes(ignored));
                });

                if (gameDirs.length === 0) {
                    container.innerHTML = '<p class="status-msg">No games found yet! Add a game folder to your repository.</p>';
                    return;
                }

                // Create a neat floating button for each game directory found
                gameDirs.forEach(dir => {
                    const button = document.createElement('a');
                    button.href = `./${dir.name}/`;
                    button.className = 'game-button';
                    
                    // Replaces hyphens/underscores with spaces for a clean display name
                    button.textContent = dir.name.replace(/[-_]/g, ' '); 
                    
                    container.appendChild(button);
                });

            } catch (error) {
                console.error(error);
                statusMsg.textContent = 'Error loading games layout. Please refresh.';
                statusMsg.style.color = '#ff5555';
            }
        }

        // Run the scanner immediately on page load
        fetchGames();
    </script>
</body>
</html>
