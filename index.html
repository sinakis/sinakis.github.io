<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinakis Games Hub</title>
    <style>
        /* Base Setup - Clean Dark Game Interface Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #2b1055, #100b26);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
            padding-top: 40px;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Fixed Row Grid Container */
        #games-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            width: 95%;
            max-width: 1200px;
            height: 65vh; /* Standardizing card height */
            min-height: 400px;
        }

        /* Solid Column Button Card Layout */
        .game-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background: linear-gradient(180deg, rgba(67, 39, 143, 0.6) 0%, rgba(29, 14, 74, 0.9) 100%);
            border: 2px solid #573a96;
            border-radius: 4px;
            text-decoration: none;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Subtle Static Border Highlight on Click/Active Selection */
        .game-card:hover {
            border-color: #ffd800;
            background: linear-gradient(180deg, rgba(82, 49, 171, 0.7) 0%, rgba(39, 20, 97, 0.95) 100%);
        }

        /* Bottom Section containing Titles */
        .game-card-info {
            width: 100%;
            background: #140d2d;
            border-top: 2px solid #573a96;
            padding: 20px 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .game-title {
            margin: 0 0 4px 0;
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        .game-subtitle {
            margin: 0;
            font-size: 0.85rem;
            color: #bfaee3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Highlights the first or active choice like your reference photo */
        .game-card:hover .game-card-info {
            background: #ffd800;
        }
        .game-card:hover .game-title {
            color: #140d2d;
        }
        .game-card:hover .game-subtitle {
            color: #5b4600;
        }
    </style>
</head>
<body>

    <h1>Game Modes</h1>
    
    <div id="games-container">
        <!-- Solid Menu Cards load here instantly -->
    </div>

    <script>
        // 🚀 Add your exact game folder paths here
        const GAMES = [
            'space-shooter',
            'game-two',
            'game-three'
        ];

        function loadGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = ''; 

            GAMES.forEach(folderName => {
                const card = document.createElement('a');
                card.href = `./${folderName}/`;
                card.className = 'game-card';
                
                // Content block matching the bottom row layout inside the column cards
                const infoBlock = document.createElement('div');
                infoBlock.className = 'game-card-info';
                
                const title = document.createElement('h2');
                title.className = 'game-title';
                title.textContent = folderName.replace(/[-_]/g, ' '); 
                
                const subtitle = document.createElement('p');
                subtitle.className = 'game-subtitle';
                subtitle.textContent = 'Launch Game';

                infoBlock.appendChild(title);
                infoBlock.appendChild(subtitle);
                card.appendChild(infoBlock);
                container.appendChild(card);
            });
        }

        loadGames();
    </script>
</body>
</html>
